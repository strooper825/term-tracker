[project]
name = "term-tracker"
version = "0.1.0"
description = "Term dashboards for members of Congress: nightly-ingested, sourced, refreshed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]
dbt = [
    "dbt-postgres>=1.9,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "ingest*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["api", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a reachable Postgres at DATABASE_URL (skipped locally if unreachable, required in CI)",
    "dbt: additionally needs the dbt CLI on PATH (skipped locally if missing, required in CI)",
]
