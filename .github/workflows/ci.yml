name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Migrations + tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: term
          POSTGRES_PASSWORD: term
          POSTGRES_DB: term_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U term -d term_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://term:term@localhost:5432/term_tracker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrate up, down, and up again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run tests (integration tests must not skip in CI)
        run: pytest -q
      # dbt compile joins this job in Phase 1d, once the first models exist.
