name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Migrations + tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: term
          POSTGRES_PASSWORD: term
          POSTGRES_DB: term_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U term -d term_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://term:term@localhost:5432/term_tracker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,dbt]"
      - name: Migrate up, down, and up again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: dbt build on the empty database (seeds, models, tests)
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Run tests (integration and dbt tests must not skip in CI)
        run: pytest -q

      # ---- Site: unit tests, then a real static build against the API serving the fixture mart
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm test
        working-directory: site
      - name: Start the API against the fixture mart
        run: |
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/meta/freshness > /dev/null && exit 0
            sleep 1
          done
          echo "::error::API did not start"; cat api.log; exit 1
      - name: Build the static site
        run: npm run build
        working-directory: site
        env:
          API_BASE_URL: http://127.0.0.1:8000
      - name: Confirm the built site cannot reach the API
        run: node scripts/check-static.mjs out
        working-directory: site
        env:
          API_BASE_URL: http://127.0.0.1:8000
