name: Deploy site

# Builds the static site from an API started in the runner against the managed database and
# deploys the prebuilt output with the Vercel CLI (no Git integration, no runtime server).
# Called by ingest.yml after a successful ingest, and dispatchable on its own so a frontend
# change can be published in minutes without an ingest cycle.
#
# Called by archive.yml with archive_congress set, it instead freezes a Congress (ADR 0021,
# docs/rollover-runbook.md): the same build, labelled as an archive, deployed once to the
# separate Vercel project named by the VERCEL_ARCHIVE_PROJECT_ID secret. It refuses to run
# unless the mart still describes that Congress.
#
# Every job here must stay within `contents: read`. A called workflow may not ask for more than
# its caller grants, and GitHub rejects the whole calling run at startup if any job does, whether
# or not that job would have run: a `contents: write` job added here stopped every run of
# ingest.yml on 2026-11-10 before a single step. Anything that needs to write belongs in the
# caller (archive.yml), and tests/test_rollover.py checks it.
#
# A push to main that changes only the owner's own words (site/content, edited in the browser
# editor at /admin, or an uploaded image) also deploys, so an edit is live in minutes rather than
# after the next nightly (ADR 0022). Code changes on main still wait for the nightly or a dispatch.
on:
  push:
    branches: [main]
    paths:
      - "site/content/**"
      - "site/public/uploads/**"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Vercel target: auto = production from main, preview from any other branch"
        type: choice
        options: [auto, preview, production]
        default: auto
  workflow_call:
    inputs:
      deploy_target:
        description: auto, preview, or production (auto = production from main, preview elsewhere)
        type: string
        default: auto
      # Set only by archive.yml. ingest.yml passes neither, so the nightly is never an archive.
      archive_congress:
        description: "Archive build: the Congress being frozen, e.g. 119 (deploys to the archive project, not the live site)"
        type: string
        default: ""
      archive_live_url:
        description: "Archive build: address of the live site, for the banner's link back"
        type: string
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build site -> static check -> deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # An archive goes to its own project, so it is uploaded once and never counted again
      # against the live project's deployment storage. An unset archive secret leaves this empty
      # and the secrets check below stops the run, rather than falling back to the live project.
      VERCEL_PROJECT_ID: ${{ inputs.archive_congress && secrets.VERCEL_ARCHIVE_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
      ARCHIVE_CONGRESS: ${{ inputs.archive_congress }}
      API_BASE_URL: http://127.0.0.1:8000
      # Read by site/src/lib/archive.ts at build time. Empty on an ordinary deploy. ARCHIVES is a
      # repository variable such as "119=https://archive-119.example.org": the live site's links
      # to earlier Congresses.
      NEXT_PUBLIC_ARCHIVE_OF: ${{ inputs.archive_congress }}
      NEXT_PUBLIC_LIVE_URL: ${{ inputs.archive_live_url }}
      NEXT_PUBLIC_ARCHIVES: ${{ !inputs.archive_congress && vars.ARCHIVES || '' }}
    steps:
      # `auto` follows the branch: main deploys to production, anything else to preview. The
      # flag is computed in shell here rather than with an expression whose "true" branch is
      # the empty string (that branch is falsy and the expression always yields the other one).
      - name: Resolve the deployment target
        id: target
        env:
          REQUESTED: ${{ inputs.deploy_target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # An archive is its project's production deployment, whatever was requested.
          if [ -n "$ARCHIVE_CONGRESS" ]; then REQUESTED=production; fi
          case "$REQUESTED" in
            production|preview) target="$REQUESTED" ;;
            auto|"") if [ "$REF_NAME" = "main" ]; then target=production; else target=preview; fi ;;
            *) echo "::error::deploy_target must be auto, preview, or production (got '$REQUESTED')"; exit 1 ;;
          esac
          prod_flag=""
          if [ "$target" = production ]; then prod_flag="--prod"; fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "prod_flag=$prod_flag" >> "$GITHUB_OUTPUT"
          echo "Deploying to $target (requested: '${REQUESTED:-auto}', branch: $REF_NAME)"

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dbt]"

      - name: Check the secrets are set
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in DATABASE_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name secret is not set (for an archive build, VERCEL_PROJECT_ID comes from VERCEL_ARCHIVE_PROJECT_ID)"; exit 1; fi
          done
          if [ -n "$ARCHIVE_CONGRESS" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::an archive is built from main only"; exit 1
          fi

      # The API served here is this commit's code, so the mart it reads has to be this
      # commit's models. Without these two steps a branch that adds a mart column and selects
      # it renders against whatever the last nightly built, and every request touching the new
      # column answers 500: that is how policy_area broke the feed endpoint on 2026-09-13.
      # No ingest happens, so this only re-derives the mart from the raw data already there:
      # about 23 s against Neon, and idempotent when the nightly has just done it.
      - name: Export dbt connection settings from DATABASE_URL
        run: python -m ingest.dbt_env >> "$GITHUB_ENV"

      - name: Migrate
        run: alembic upgrade head

      - name: dbt build (rebuild the mart from this commit's models)
        run: dbt build --project-dir dbt --profiles-dir dbt --no-use-colors

      - name: Start the API against the managed database
        run: |
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/meta/freshness > /dev/null && exit 0
            sleep 1
          done
          echo "::error::API did not start"; cat api.log; exit 1

      # The archive must be of the Congress the mart describes right now. Once
      # vars.current_congress has moved on, this commit's models build the next Congress and an
      # "archive of the 119th" would be the 120th under the wrong banner. A source that is
      # refusing the reader (ADR 0020) is frozen into the archive as it stands, so say so.
      - name: "Archive: check the mart is still this Congress"
        if: inputs.archive_congress
        run: |
          built=$(curl -sf http://127.0.0.1:8000/api/v1/congress/overview | python -c "import json,sys; print(json.load(sys.stdin)['congress'])")
          if [ "$built" != "$ARCHIVE_CONGRESS" ]; then
            echo "::error::the mart describes Congress $built, not $ARCHIVE_CONGRESS: nothing was deployed"; exit 1
          fi
          echo "NEXT_PUBLIC_ARCHIVE_AS_OF=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          refused=$(curl -sf http://127.0.0.1:8000/api/v1/meta/freshness | python -c "import json,sys; print(','.join(s['source'] for s in json.load(sys.stdin)['sources'] if s.get('unavailable')))")
          if [ -n "$refused" ]; then
            echo "::warning::this archive freezes sources that are refusing the reader and are out of date: $refused"
          fi
          echo "## Archive of the ${ARCHIVE_CONGRESS}th Congress" >> "$GITHUB_STEP_SUMMARY"
          echo "Out-of-date sources frozen into it: ${refused:-none}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        run: npm ci --no-audit --no-fund
        working-directory: site

      - name: Build the site (Vercel prebuilt output)
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ steps.target.outputs.target }}
          PROD_FLAG: ${{ steps.target.outputs.prod_flag }}
        run: |
          npx vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
          npx vercel build $PROD_FLAG --token="$VERCEL_TOKEN"

      # The site build only ever sees an HTTP status, so without this a failed page render
      # reports "HTTP 500" and the reason stays in the runner. Print the API's own log.
      - name: API log (on failure)
        if: failure()
        run: |
          echo "::group::api.log"
          cat api.log || echo "no api.log"
          echo "::endgroup::"

      # Next writes four RSC payload files per page beside the HTML, purely so a <Link> can
      # navigate without a page load. They were 307 MB of the 495 MB export and 18,464 of its
      # 23,102 files on 2026-09-20, and Vercel bills deployment storage on the UNPACKED
      # deployment, so they are dropped before the upload (ADR 0017). Runs before the static
      # check so that check only reads what actually ships.
      - name: Drop the client prefetch payloads and report the deployment size
        working-directory: site
        run: |
          echo "## Deployment size" >> "$GITHUB_STEP_SUMMARY"
          node scripts/strip-prefetch-payloads.mjs .vercel/output/static | tee -a "$GITHUB_STEP_SUMMARY"

      # The Hobby plan refuses a CLI upload over 100 MB, and the upload is this output as one
      # tgz. It was 31.5 MB at twenty members on 2026-11-13 and is the first limit growth meets
      # (ADR 0023), so every deploy records it and warns from 80 MB. The figure is this runner's
      # own gzip of the output, a close estimate of what the CLI sends, not the CLI's number.
      - name: Report the upload size against the 100 MB limit
        working-directory: site
        run: |
          bytes=$(tar -czf - -C .vercel output | wc -c)
          mb=$(( bytes / 1000000 ))
          echo "- Upload (tgz of the output): about ${mb} MB of the 100 MB a Hobby upload may be" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -ge 80 ]; then
            echo "::warning::the deployment upload is about ${mb} MB; the Hobby limit is 100 MB (ADR 0023)"
          fi

      # A static export should produce no functions at all. Vercel reported 3.13 GB of function
      # storage for this project on 2026-09-20, which nothing in the repo accounts for, so every
      # deploy now records what the builder actually emitted.
      - name: Report the function output (a static export should have none)
        working-directory: site
        run: |
          {
            echo "- Functions emitted by the build:"
            if [ -d .vercel/output/functions ]; then
              du -sh .vercel/output/functions | sed "s/^/  /"
              find .vercel/output/functions -maxdepth 2 | head -30 | sed "s/^/  /"
            else
              echo "  none"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Confirm the built site cannot reach the API
        working-directory: site
        run: node scripts/check-static.mjs .vercel/output/static

      # --archive=tgz uploads the output as one tarball instead of file by file. Even with the
      # prefetch payloads stripped the export is one file per page, and the free tier refuses a
      # deployment of more than 5,000 files:
      # "Too many requests - try again in 24 hours (more than 5000, code: api-upload-free)".
      # `vercel build` has no such flag and needs none: it only writes .vercel/output locally,
      # and nothing is uploaded until this step.
      - name: Deploy the prebuilt output to Vercel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ steps.target.outputs.target }}
          PROD_FLAG: ${{ steps.target.outputs.prod_flag }}
        run: |
          url=$(npx vercel deploy --prebuilt --archive=tgz $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "deployed: $url"
          echo "## Site" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed $TARGET from \`${{ github.ref_name }}\`: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the API
        if: always()
        run: pkill -f "uvicorn api.main:app" || true

      # The Migrate step above moved the managed database to this branch's head. Called from
      # ingest.yml (whose workflow name the github context then carries), the caller restores
      # main's schema after the whole run; dispatched on its own from a branch, this does it
      # (ADR 0019).
      - name: Put the database back at main's schema
        if: always() && github.ref_name != 'main' && github.workflow == 'Deploy site'
        run: |
          git fetch --depth=1 origin main
          python -m ingest.schema restore --main-ref FETCH_HEAD
