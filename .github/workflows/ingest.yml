name: Nightly ingest

# ONE-OFF on branch neon-revert-election-context only; never merged. Published under the
# dispatchable ingest.yml name so it can be dispatched without touching main (schedules only
# run from main, so the nightly is unaffected). Returns the managed database to Alembic
# revision 0006 after the closed PR #21 run migrated it to 0007.
on:
  workflow_dispatch:

# Same group as the nightly, so the two can never run at the same time.
concurrency:
  group: nightly-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  revert:
    name: revert Neon to Alembic 0006 (closed PR 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .

      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set"; exit 1
          fi

      - name: Before - revision and objects
        run: python ops/neon_revert_election_context.py report

      - name: Guard - revision 0007, CASCADE drops only staging.stg_election_returns
        run: python ops/neon_revert_election_context.py guard

      - name: alembic downgrade 0006
        run: |
          alembic current
          alembic downgrade 0006
          alembic current

      - name: Drop the objects the downgrade does not own
        run: python ops/neon_revert_election_context.py drop

      - name: Verify - revision 0006, all five objects absent
        run: python ops/neon_revert_election_context.py verify
