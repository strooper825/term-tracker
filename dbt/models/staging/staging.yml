version: 2

models:
  - name: stg_legislators
    columns:
      - name: bioguide_id
        tests: [unique, not_null]
  - name: stg_legislator_terms
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: chamber
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]
  - name: stg_legislator_leadership_roles
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: start_date
        tests: [not_null]
  - name: stg_committees
    columns:
      - name: thomas_id
        tests: [unique, not_null]
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate", "joint"] } }
  - name: stg_committee_memberships
    columns:
      - name: committee_id
        tests: [not_null]
      - name: bioguide_id
        tests: [not_null]
  - name: stg_member_legislation
    columns:
      - name: role
        tests:
          - accepted_values: { arguments: { values: ["sponsor", "cosponsor"] } }
  - name: stg_bills
    columns:
      - name: kind
        tests:
          - accepted_values: { arguments: { values: ["bill", "amendment"] } }
      - name: title
        tests: [not_null]
      - name: introduced_date
        tests: [not_null]
      - name: update_date
        tests: [not_null]
  - name: stg_bill_actions
    columns:
      - name: action_date
        tests: [not_null]
      - name: action_hash
        tests: [not_null]
  - name: stg_bill_cosponsors
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: sponsorship_date
        tests: [not_null]
  - name: stg_house_roll_calls
    columns:
      - name: roll_number
        tests: [not_null]
      - name: vote_date
        tests: [not_null]
  - name: stg_house_member_votes
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: position
        tests:
          - accepted_values: { arguments: { values: ["Yea", "Nay", "Present", "Not Voting", "Other"] } }
  - name: stg_senate_roll_calls
    columns:
      - name: roll_number
        tests: [not_null]
      - name: vote_date
        tests: [not_null]
  - name: stg_senate_member_votes
    columns:
      - name: lis_member_id
        tests: [not_null]
      - name: position
        tests:
          - accepted_values: { arguments: { values: ["Yea", "Nay", "Present", "Not Voting", "Other"] } }
