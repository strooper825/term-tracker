version: 2

models:
  - name: stg_legislators
    columns:
      - name: bioguide_id
        tests: [unique, not_null]
  - name: stg_legislator_terms
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: chamber
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]
  - name: stg_legislator_leadership_roles
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: start_date
        tests: [not_null]
  - name: stg_committees
    columns:
      - name: thomas_id
        tests: [unique, not_null]
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate", "joint"] } }
  - name: stg_committee_memberships
    columns:
      - name: committee_id
        tests: [not_null]
      - name: bioguide_id
        tests: [not_null]
  - name: stg_member_legislation
    columns:
      - name: role
        tests:
          - accepted_values: { arguments: { values: ["sponsor", "cosponsor"] } }
  - name: stg_bills
    columns:
      - name: kind
        tests:
          - accepted_values: { arguments: { values: ["bill", "amendment"] } }
      - name: title
        tests: [not_null]
      - name: introduced_date
        tests: [not_null]
      - name: update_date
        tests: [not_null]
  - name: stg_bill_actions
    columns:
      - name: action_date
        tests: [not_null]
      - name: action_hash
        tests: [not_null]
  - name: stg_bill_cosponsors
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: sponsorship_date
        tests: [not_null]
      - name: party
        tests: [not_null]
      - name: full_name
        tests: [not_null]
  - name: stg_house_ptr_filings
    columns:
      - name: doc_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values: { arguments: { values: ["parsed", "scanned", "failed"] } }
      - name: filing_date
        tests: [not_null]
  - name: stg_house_ptr_transactions
    columns:
      - name: trade_date
        tests: [not_null]
      - name: notification_date
        tests: [not_null]
      - name: amount_low
        tests: [not_null]
      - name: asset_type_code
        tests: [not_null]
      - name: transaction_type_code
        tests: [not_null]
  - name: stg_statements
    columns:
      - name: title
        tests: [not_null]
      - name: url
        tests: [not_null]
      - name: published_at
        tests: [not_null]
  - name: stg_bill_summaries
    columns:
      - name: version_code
        tests: [not_null]
      - name: action_date
        tests: [not_null]
      - name: action_desc
        tests: [not_null]
      - name: text_html
        tests: [not_null]
  - name: stg_house_roll_calls
    columns:
      - name: roll_number
        tests: [not_null]
      - name: vote_date
        tests: [not_null]
  - name: stg_house_member_votes
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: position
        tests:
          - accepted_values: { arguments: { values: ["Yea", "Nay", "Present", "Not Voting", "Other"] } }
  - name: stg_senate_roll_calls
    columns:
      - name: roll_number
        tests: [not_null]
      - name: vote_date
        tests: [not_null]
  - name: stg_senate_member_votes
    columns:
      - name: lis_member_id
        tests: [not_null]
      - name: position
        tests:
          - accepted_values: { arguments: { values: ["Yea", "Nay", "Present", "Not Voting", "Other"] } }
  - name: stg_fec_candidates
    columns:
      - name: candidate_id
        tests: [unique, not_null]
      - name: bioguide_id
        tests: [not_null]
      - name: office
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["H", "S", "P"] } }
  - name: stg_fec_committees
    columns:
      - name: committee_id
        tests: [not_null]
      - name: candidate_id
        tests: [not_null]
      - name: designation
        tests: [not_null]
  - name: stg_fec_committee_totals
    columns:
      - name: committee_id
        tests: [not_null]
      - name: cycle
        tests: [not_null]
      - name: receipts
        tests: [not_null]
      - name: coverage_end_date
        tests: [not_null]

  - name: stg_constituency_geometry
    description: One row per state and House district map, typed from raw.constituency_geometry.
    columns:
      - name: geoid
        tests: [not_null]
      - name: kind
        tests:
          - accepted_values: { arguments: { values: ["state", "district"] } }
      - name: outline
        tests: [not_null]

  - name: stg_acs_estimates
    description: One row per state and House district ACS release, typed, sentinels turned into null.
    columns:
      - name: geoid
        tests: [not_null]
      - name: kind
        tests:
          - accepted_values: { arguments: { values: ["state", "district"] } }
