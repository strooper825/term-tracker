version: 2

sources:
  - name: raw
    description: Verbatim upstream payloads loaded by ingest/ (one table per source entity).
    schema: raw
    tables:
      - name: legislator
        description: legislators-current.yaml, one row per current member; payload has id, name, bio, terms.
      - name: committee
        description: committees-current.yaml, one row per top-level committee; subcommittees nested in payload.
      - name: committee_membership
        description: committee-membership-current.yaml, one row per committee or subcommittee id; payload is the member list.
      - name: member_legislation
        description: One row per sponsored/cosponsored list item per tracked member, current Congress only.
      - name: bill
        description: Detail record per bill or amendment (payload from /bill or /amendment).
      - name: bill_actions
        description: Actions list per bill or amendment; payload is a JSON array.
      - name: bill_cosponsors
        description: Cosponsors list per bill or amendment; payload is a JSON array.
      - name: bill_summaries
        description: CRS summaries list per bill (every version); payload is a JSON array, empty when the bill has no summary.
      - name: house_vote
        description: Item of /house-vote/{congress}/{session} (Congress.gov), one row per roll call.
      - name: house_vote_members
        description: All member positions for one House roll call (results[] under the payload).
      - name: senate_vote_menu
        description: senate.gov session vote menu as JSON, one row per session.
      - name: senate_vote
        description: senate.gov roll-call vote XML as JSON, one row per roll call, all senator positions.
      - name: fec_candidate
        description: OpenFEC /candidate/{id}/ record for every FEC candidate id of a tracked member.
      - name: fec_committee
        description: OpenFEC /candidate/{id}/committees/?cycle= item, every committee linked to the current-office candidate in the cycle.
      - name: fec_committee_totals
        description: OpenFEC /committee/{id}/totals/?cycle= record of the principal campaign committee.
      - name: constituency_geometry
        description: Finished SVG map of one state or House district per Congress, from the Census cartographic boundary files (ADR 0015).
      - name: acs_estimate
        description: ACS 5-year estimates and margins of error for one state or House district per release, verbatim from the Census Data API.
