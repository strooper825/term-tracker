version: 2

# Constructed cases for the Stock trades models (ADR 0018, ADR 0026). The parsed-trade path
# (code mapping, amount bands, totals, Senate amendments) is exercised here on invented rows
# rather than on a real member's filing.
unit_tests:
  - name: stg_house_ptr_transactions_reads_cells
    model: stg_house_ptr_transactions
    given:
      - input: source('raw', 'house_ptr_transaction')
        format: sql
        rows: |
          select 'D1' as doc_id, 1 as row_number, 'T000001' as bioguide_id, 'https://example.test/a.pdf#page=1' as source_url, now() as fetched_at,
                 '{"page": 1, "owner": null, "asset": "Amazon.com, Inc. - Common Stock (AMZN) [ST]", "type": "S (partial)", "trade_date": "03/16/2026", "notification_date": "03/17/2026", "amount": "$1,001 - $15,000", "detail": {"filing_status": "New"}}'::jsonb as payload
          union all
          select 'D1', 2, 'T000001', 'https://example.test/a.pdf#page=1', now(),
                 '{"page": 1, "owner": "SP", "asset": "US Treasury Note 3.5% DUE 01/31/28 (91282CGH8) [GS]", "type": "P", "trade_date": "01/26/2026", "notification_date": "02/04/2026", "amount": "$100,001 - $250,000", "detail": {}}'::jsonb
          union all
          select 'D1', 3, 'T000001', 'https://example.test/a.pdf#page=2', now(),
                 '{"page": 2, "owner": "JT", "asset": "Berkshire Hathaway Inc. New Common Stock (BRK.B) [ST]", "type": "P", "trade_date": "01/26/2026", "notification_date": "02/04/2026", "amount": "$1,000,001 - $5,000,000", "detail": {}}'::jsonb
          union all
          select 'D1', 4, 'T000001', 'https://example.test/a.pdf#page=2', now(),
                 '{"page": 2, "owner": "DC", "asset": "Invesco QQQ [OT]", "type": "S", "trade_date": "01/26/2026", "notification_date": "02/04/2026", "amount": "Over $50,000,000", "detail": {}}'::jsonb
          union all
          select 'D1', 6, 'T000001', 'https://example.test/a.pdf#page=3', now(),
                 '{"page": 3, "owner": null, "asset": "New Water Capital Partners II, LP (GLAS Funds, LP) [HN]", "type": "P", "trade_date": "04/03/2025", "notification_date": "04/28/2025", "amount": "$1,972.55", "detail": {}}'::jsonb
          union all
          select 'D1', 5, 'T000001', 'https://example.test/a.pdf#page=2', now(),
                 '{"page": 2, "owner": null, "asset": "DIA - State Street SPDR Dow Jones Indust Avg ETF Trust NYSEARCA: DIA [OT]", "type": "E", "trade_date": "01/26/2026", "notification_date": "02/04/2026", "amount": "$15,001 - $50,000", "detail": {}}'::jsonb
    expect:
      rows:
        - {row_number: 1, owner_code: SELF, asset_type_code: ST, ticker: AMZN, asset_name: "Amazon.com, Inc. - Common Stock", transaction_type_code: "S (partial)", amount_low: 1001, amount_high: 15000, trade_date: 2026-03-16}
        # A CUSIP is not a ticker: the bond keeps it in the name.
        - {row_number: 2, owner_code: SP, asset_type_code: GS, ticker: null, asset_name: "US Treasury Note 3.5% DUE 01/31/28 (91282CGH8)", transaction_type_code: P, amount_low: 100001, amount_high: 250000, trade_date: 2026-01-26}
        - {row_number: 3, owner_code: JT, asset_type_code: ST, ticker: BRK.B, asset_name: "Berkshire Hathaway Inc. New Common Stock", transaction_type_code: P, amount_low: 1000001, amount_high: 5000000, trade_date: 2026-01-26}
        # The top band has a low end and no high end.
        - {row_number: 4, owner_code: DC, asset_type_code: OT, ticker: null, asset_name: Invesco QQQ, transaction_type_code: S, amount_low: 50000000, amount_high: null, trade_date: 2026-01-26}
        - {row_number: 5, owner_code: SELF, asset_type_code: OT, ticker: null, asset_name: "DIA - State Street SPDR Dow Jones Indust Avg ETF Trust NYSEARCA: DIA", transaction_type_code: E, amount_low: 15001, amount_high: 50000, trade_date: 2026-01-26}
        # A filer may enter one exact figure instead of a band: low equals high, kind says so.
        - {row_number: 6, owner_code: SELF, asset_type_code: HN, ticker: null, asset_name: "New Water Capital Partners II, LP (GLAS Funds, LP)", transaction_type_code: P, amount_low: 1972.55, amount_high: 1972.55, trade_date: 2025-04-03}

  - name: stg_senate_ptr_transactions_reads_cells
    model: stg_senate_ptr_transactions
    given:
      - input: source('raw', 'senate_ptr_transaction')
        format: sql
        rows: |
          select 'R1' as report_id, 1 as row_number, 'T000002' as bioguide_id, 'https://example.test/r1/' as source_url, now() as fetched_at,
                 '{"transaction_date": "09/25/2026", "owner": "Joint", "ticker": "APTV", "asset_name": "Aptiv PLC Ordinary Shares", "asset_detail": {}, "asset_type": "Stock", "type": "Sale (Partial)", "amount": "$1,001 - $15,000", "comment": null}'::jsonb as payload
          union all
          select 'R1', 2, 'T000002', 'https://example.test/r1/', now(),
                 '{"transaction_date": "09/15/2026", "owner": "Child", "ticker": null, "asset_name": "DELL INTL LLC/EMC CORP", "asset_detail": {"Rate/Coupon": "5.6%", "Matures": "2033-09-15"}, "asset_type": "Corporate Bond", "type": "Purchase", "amount": "$15,001 - $50,000", "comment": "Bought at issue"}'::jsonb
          union all
          select 'R1', 3, 'T000002', 'https://example.test/r1/', now(),
                 '{"transaction_date": "09/16/2026", "owner": "Spouse", "ticker": "MSFT", "asset_name": "Microsoft Corp", "asset_detail": {}, "asset_type": "Stock", "type": "Sale (Full)", "amount": "Over $50,000,000", "comment": null}'::jsonb
          union all
          select 'R1', 4, 'T000002', 'https://example.test/r1/', now(),
                 '{"transaction_date": "09/17/2026", "owner": "Self", "ticker": null, "asset_name": "Something new", "asset_detail": {}, "asset_type": "Cryptocurrency", "type": "Gift", "amount": "$1,001 - $15,000", "comment": null}'::jsonb
    expect:
      rows:
        # eFD's words become the House codes for the same categories.
        - {row_number: 1, owner_code: JT, ticker: APTV, asset_type_code: Stock, transaction_type_code: "S (partial)", amount_kind: band, amount_low: 1001, amount_high: 15000, trade_date: 2026-09-25, notification_date: null, description: null, comments: null}
        # A bond's coupon and maturity become its description.
        - {row_number: 2, owner_code: DC, ticker: null, asset_type_code: Corporate Bond, transaction_type_code: P, amount_kind: band, amount_low: 15001, amount_high: 50000, trade_date: 2026-09-15, notification_date: null, description: "Matures: 2033-09-15; Rate/Coupon: 5.6%", comments: Bought at issue}
        - {row_number: 3, owner_code: SP, ticker: MSFT, asset_type_code: Stock, transaction_type_code: S, amount_kind: top_band, amount_low: 50000000, amount_high: null, trade_date: 2026-09-16, notification_date: null, description: null, comments: null}
        # A value with no House code is kept as printed; the mart flags it.
        - {row_number: 4, owner_code: SELF, ticker: null, asset_type_code: Cryptocurrency, transaction_type_code: Gift, amount_kind: band, amount_low: 1001, amount_high: 15000, trade_date: 2026-09-17, notification_date: null, description: null, comments: null}

  - name: stock_trade_maps_codes_and_keeps_unknown_ones
    model: stock_trade
    given:
      - input: ref('stg_house_ptr_transactions')
        rows:
          - {doc_id: D1, row_number: 1, bioguide_id: T000001, owner_code: SP, asset_name: Paychex, asset_type_code: ST, transaction_type_code: S, trade_date: 2026-01-14, notification_date: 2026-02-04, amount_low: 15001, amount_high: 50000, source_url: "https://example.test/a.pdf#page=1"}
          - {doc_id: D1, row_number: 2, bioguide_id: T000001, owner_code: SELF, asset_name: Odd asset, asset_type_code: ZZ, transaction_type_code: X, trade_date: 2026-01-20, notification_date: 2026-02-04, amount_low: 1001, amount_high: 15000, source_url: "https://example.test/a.pdf#page=1"}
      - input: ref('stg_house_ptr_filings')
        rows:
          - {doc_id: D1, bioguide_id: T000001, filing_date: 2026-02-17, status: parsed}
      - input: ref('member')
        rows:
          - {bioguide_id: T000001}
      - input: ref('ptr_owner_codes')
        rows:
          - {code: SELF, label: Self}
          - {code: SP, label: Spouse}
      - input: ref('ptr_asset_types')
        rows:
          - {code: ST, label: Stocks (including ADRs)}
      - input: ref('ptr_transaction_types')
        rows:
          - {code: S, label: Sale, direction: sale}
          - {code: P, label: Purchase, direction: purchase}
      - input: ref('stg_senate_ptr_transactions')
        rows:
          # R_OLD was replaced by the amendment R_NEW: only R_NEW's trade is listed.
          - {report_id: R_OLD, row_number: 1, bioguide_id: T000001, owner_code: JT, asset_name: Old row, asset_type_code: Stock, transaction_type_code: P, trade_date: 2026-03-01, amount_low: 1001, amount_high: 15000, source_url: "https://example.test/old/"}
          - {report_id: R_NEW, row_number: 1, bioguide_id: T000001, owner_code: JT, asset_name: Aptiv, asset_type_code: Stock, transaction_type_code: P, trade_date: 2026-03-01, amount_low: 1001, amount_high: 15000, source_url: "https://example.test/new/"}
          # A Senate asset type no seed maps is flagged like a House code.
          - {report_id: R_NEW, row_number: 2, bioguide_id: T000001, owner_code: JT, asset_name: Coin, asset_type_code: Cryptocurrency, transaction_type_code: P, trade_date: 2026-03-02, amount_low: 1001, amount_high: 15000, source_url: "https://example.test/new/"}
      - input: ref('stg_senate_ptr_reports')
        rows:
          - {report_id: R_OLD, bioguide_id: T000001, filing_date: 2026-03-05, supersedes: null}
          - {report_id: R_NEW, bioguide_id: T000001, filing_date: 2026-04-01, supersedes: R_OLD}
      - input: ref('efd_asset_types')
        rows:
          - {code: Stock, label: Stock}
      - input: ref('stg_sec_companies')
        rows: []
    expect:
      rows:
        - {doc_id: D1, row_number: 1, owner_label: Spouse, asset_type_label: Stocks (including ADRs), transaction_type_label: Sale, direction: sale, days_to_file: 34, has_unmapped_code: false, source: house_clerk_ptr}
        # No seed maps ZZ or X: the row stays, labelled by its raw codes, and is flagged.
        - {doc_id: D1, row_number: 2, owner_label: Self, asset_type_label: ZZ, transaction_type_label: X, direction: other, days_to_file: 28, has_unmapped_code: true, source: house_clerk_ptr}
        - {doc_id: R_NEW, row_number: 1, owner_label: JT, asset_type_label: Stock, transaction_type_label: Purchase, direction: purchase, days_to_file: 31, has_unmapped_code: true, source: senate_efd}
        - {doc_id: R_NEW, row_number: 2, owner_label: JT, asset_type_label: Cryptocurrency, transaction_type_label: Purchase, direction: purchase, days_to_file: 30, has_unmapped_code: true, source: senate_efd}

  - name: member_stock_trades_statuses_and_totals
    model: member_stock_trades
    given:
      - input: ref('member')
        rows:
          - {bioguide_id: H_FILED}
          - {bioguide_id: H_NONE}
          - {bioguide_id: S_SENATE}
          - {bioguide_id: S_BOTH}
      - input: ref('term')
        rows:
          - {bioguide_id: H_FILED, chamber: house, start_date: 2025-01-03}
          - {bioguide_id: H_NONE, chamber: house, start_date: 2025-01-03}
          - {bioguide_id: S_SENATE, chamber: senate, start_date: 2025-01-03}
          # Served in the House, now in the Senate: the latest term decides.
          - {bioguide_id: S_BOTH, chamber: house, start_date: 2019-01-03}
          - {bioguide_id: S_BOTH, chamber: senate, start_date: 2025-01-03}
      - input: ref('stock_trade_filing')
        rows:
          - {doc_id: D1, bioguide_id: H_FILED, status: parsed, filing_date: 2026-02-17, fetched_at: 2026-09-20}
          - {doc_id: D2, bioguide_id: H_FILED, status: scanned, filing_date: 2026-03-09, fetched_at: 2026-09-20}
          - {doc_id: D3, bioguide_id: H_FILED, status: failed, filing_date: 2026-01-05, fetched_at: 2026-09-20}
      - input: ref('stock_trade')
        rows:
          - {bioguide_id: H_FILED, direction: purchase, amount_low: 1001, amount_high: 15000, trade_date: 2026-01-10}
          - {bioguide_id: H_FILED, direction: purchase, amount_low: 50000000, amount_high: null, trade_date: 2026-01-12}
          - {bioguide_id: H_FILED, direction: sale, amount_low: 15001, amount_high: 50000, trade_date: 2026-01-14}
          - {bioguide_id: H_FILED, direction: exchange, amount_low: 1001, amount_high: 15000, trade_date: 2026-01-20}
      - input: source('meta', 'ingest_run')
        rows:
          - {source: house_ptr, status: success, finished_at: "2026-09-20 06:10:00+00"}
          - {source: house_ptr, status: failed, finished_at: "2026-09-21 06:10:00+00"}
          - {source: fec, status: success, finished_at: "2026-09-22 06:10:00+00"}
    expect:
      rows:
        - {bioguide_id: H_FILED, chamber: house, status: filed, filings: 3, filings_parsed: 1, filings_scanned: 1, filings_failed: 1, latest_filing_date: 2026-03-09, trades: 4, purchases: 2, sales: 1, exchanges: 1, purchases_low: "50001001.00", purchases_high: "15000.00", purchases_high_is_open: true, sales_low: "15001.00", sales_high: "50000.00", sales_high_is_open: false, first_trade_date: 2026-01-10, last_trade_date: 2026-01-20, covers_from: 2025-01-03, lookup_url: "https://disclosures-clerk.house.gov/FinancialDisclosure", source: house_clerk_ptr, checked_at: "2026-09-20 06:10:00+00"}
        - {bioguide_id: H_NONE, chamber: house, status: no_filings, filings: 0, filings_parsed: 0, filings_scanned: 0, filings_failed: 0, latest_filing_date: null, trades: 0, purchases: 0, sales: 0, exchanges: 0, purchases_low: 0, purchases_high: 0, purchases_high_is_open: false, sales_low: 0, sales_high: 0, sales_high_is_open: false, first_trade_date: null, last_trade_date: null, covers_from: 2025-01-03, lookup_url: "https://disclosures-clerk.house.gov/FinancialDisclosure", source: house_clerk_ptr, checked_at: "2026-09-20 06:10:00+00"}
        # eFD has never been read: the Senate has no record to show, and no checked date.
        - {bioguide_id: S_SENATE, chamber: senate, status: senate_unavailable, filings: 0, filings_parsed: 0, filings_scanned: 0, filings_failed: 0, latest_filing_date: null, trades: 0, purchases: 0, sales: 0, exchanges: 0, purchases_low: 0, purchases_high: 0, purchases_high_is_open: false, sales_low: 0, sales_high: 0, sales_high_is_open: false, first_trade_date: null, last_trade_date: null, covers_from: 2025-01-03, lookup_url: "https://efdsearch.senate.gov/search/", source: senate_efd, checked_at: null}
        - {bioguide_id: S_BOTH, chamber: senate, status: senate_unavailable, filings: 0, filings_parsed: 0, filings_scanned: 0, filings_failed: 0, latest_filing_date: null, trades: 0, purchases: 0, sales: 0, exchanges: 0, purchases_low: 0, purchases_high: 0, purchases_high_is_open: false, sales_low: 0, sales_high: 0, sales_high_is_open: false, first_trade_date: null, last_trade_date: null, covers_from: 2025-01-03, lookup_url: "https://efdsearch.senate.gov/search/", source: senate_efd, checked_at: null}

  - name: member_stock_trades_senate_once_efd_is_read
    model: member_stock_trades
    given:
      - input: ref('member')
        rows:
          - {bioguide_id: S_FILED}
          - {bioguide_id: S_NONE}
      - input: ref('term')
        rows:
          - {bioguide_id: S_FILED, chamber: senate, start_date: 2025-01-03}
          - {bioguide_id: S_NONE, chamber: senate, start_date: 2025-01-03}
      - input: ref('stock_trade_filing')
        rows:
          # Two filings, one replaced by the other: both count as filings.
          - {doc_id: R_OLD, bioguide_id: S_FILED, status: parsed, filing_date: 2026-03-05, fetched_at: 2026-11-16}
          - {doc_id: R_NEW, bioguide_id: S_FILED, status: parsed, filing_date: 2026-04-01, fetched_at: 2026-11-16}
      - input: ref('stock_trade')
        rows:
          - {bioguide_id: S_FILED, direction: sale, amount_low: 1001, amount_high: 15000, trade_date: 2026-03-01}
      - input: source('meta', 'ingest_run')
        rows:
          - {source: senate_ptr, status: success, finished_at: "2026-11-16 18:10:00+00"}
          - {source: house_ptr, status: success, finished_at: "2026-11-16 18:05:00+00"}
    expect:
      rows:
        - {bioguide_id: S_FILED, chamber: senate, status: filed, filings: 2, filings_parsed: 2, filings_scanned: 0, filings_failed: 0, latest_filing_date: 2026-04-01, trades: 1, purchases: 0, sales: 1, exchanges: 0, purchases_low: 0, purchases_high: 0, purchases_high_is_open: false, sales_low: "1001.00", sales_high: "15000.00", sales_high_is_open: false, first_trade_date: 2026-03-01, last_trade_date: 2026-03-01, covers_from: 2025-01-03, lookup_url: "https://efdsearch.senate.gov/search/", source: senate_efd, checked_at: "2026-11-16 18:10:00+00"}
        - {bioguide_id: S_NONE, chamber: senate, status: no_filings, filings: 0, filings_parsed: 0, filings_scanned: 0, filings_failed: 0, latest_filing_date: null, trades: 0, purchases: 0, sales: 0, exchanges: 0, purchases_low: 0, purchases_high: 0, purchases_high_is_open: false, sales_low: 0, sales_high: 0, sales_high_is_open: false, first_trade_date: null, last_trade_date: null, covers_from: 2025-01-03, lookup_url: "https://efdsearch.senate.gov/search/", source: senate_efd, checked_at: "2026-11-16 18:10:00+00"}

  # ADR 0032: a trade in an industry one of the member's committees oversees.
  - name: trade_committee_overlap_matches_seat_congress_and_sic_range
    model: trade_committee_overlap
    given:
      - input: ref('stock_trade')
        rows:
          # On Armed Services, a missile maker: a note.
          - {bioguide_id: M1, doc_id: D1, row_number: 1, trade_date: 2025-06-02, ticker: LMT, company: Lockheed, sic: 3760}
          # On Armed Services, a computer maker (3571): outside every mapped range, no note.
          - {bioguide_id: M1, doc_id: D1, row_number: 2, trade_date: 2025-06-02, ticker: AAPL, company: Apple, sic: 3571}
          # A bank, but the member sits on no committee that oversees banks: no note.
          - {bioguide_id: M1, doc_id: D1, row_number: 3, trade_date: 2025-06-02, ticker: JPM, company: JPMorgan, sic: 6021}
          # A bond: no company, no industry, no note.
          - {bioguide_id: M1, doc_id: D1, row_number: 4, trade_date: 2025-06-02, ticker: null, company: null, sic: null}
          # 2 January 2025 is still the 118th Congress: the 119th seat does not count.
          - {bioguide_id: M1, doc_id: D2, row_number: 1, trade_date: 2025-01-02, ticker: LMT, company: Lockheed, sic: 3760}
          # On Ways and Means, which is not mapped: no note for a bank.
          - {bioguide_id: M2, doc_id: D3, row_number: 1, trade_date: 2026-02-10, ticker: JPM, company: JPMorgan, sic: 6021}
      - input: ref('committee_membership')
        rows:
          - {bioguide_id: M1, committee_thomas_id: HSAS, congress: 119}
          - {bioguide_id: M2, committee_thomas_id: HSWM, congress: 119}
      - input: ref('committee_industries')
        rows:
          - {committee_thomas_id: HSAS, sic_from: 3760, sic_to: 3769, industry: Guided missiles and space vehicles, basis: Military and defense}
          - {committee_thomas_id: HSBA, sic_from: 6000, sic_to: 6299, industry: "Banks, lenders and securities firms", basis: The banking system}
      - input: ref('committee')
        rows:
          - {thomas_id: HSAS, name: House Committee on Armed Services}
          - {thomas_id: HSWM, name: House Committee on Ways and Means}
          - {thomas_id: HSBA, name: House Committee on Financial Services}
    expect:
      rows:
        - {bioguide_id: M1, doc_id: D1, row_number: 1, committee_thomas_id: HSAS, committee_name: House Committee on Armed Services, industry: Guided missiles and space vehicles}
