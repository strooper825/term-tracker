version: 2

# Constructed cases for the annual-disclosure listing (ADR 0027): extensions become notes on the
# report they delay, or a "not filed yet" row; a House extension filed in the covered year itself
# is not an annual report's; labels.
unit_tests:
  - name: annual_disclosure_extensions_and_labels
    model: annual_disclosure
    given:
      - input: ref('member')
        rows:
          - {bioguide_id: H1}
          - {bioguide_id: S1}
      - input: ref('stg_annual_disclosures')
        rows:
          # House, 2024: an extension in May 2025, then the report in August.
          - {source: house_clerk, doc_id: "30022811", bioguide_id: H1, kind: extension, covers_year: 2024, filing_date: 2025-04-23, amendment: null, source_url: "https://example.test/x1.pdf"}
          - {source: house_clerk, doc_id: "10066620", bioguide_id: H1, kind: annual, covers_year: 2024, filing_date: 2025-08-13, amendment: null, source_url: "https://example.test/o1.pdf"}
          # House, 2025: an extension filed in 2025 itself (a candidate's) is not the annual report's.
          - {source: house_clerk, doc_id: "30025258", bioguide_id: H1, kind: extension, covers_year: 2025, filing_date: 2025-07-15, amendment: null, source_url: "https://example.test/x2.pdf"}
          - {source: house_clerk, doc_id: "10076278", bioguide_id: H1, kind: annual, covers_year: 2025, filing_date: 2026-05-12, amendment: null, source_url: "https://example.test/o2.pdf"}
          - {source: house_clerk, doc_id: "8221318", bioguide_id: H1, kind: amendment, covers_year: 2024, filing_date: 2026-02-04, amendment: null, source_url: "https://example.test/a1.pdf"}
          # House, 2026: an extension and no report yet.
          - {source: house_clerk, doc_id: "30099999", bioguide_id: H1, kind: extension, covers_year: 2026, filing_date: 2027-05-10, amendment: null, source_url: "https://example.test/x3.pdf"}
          # Senate: eFD names the year; a new member report and an amended annual report.
          - {source: senate_efd, doc_id: S_X, bioguide_id: S1, kind: extension, covers_year: 2025, filing_date: 2026-03-17, amendment: 0, source_url: "https://example.test/sx/"}
          - {source: senate_efd, doc_id: S_O, bioguide_id: S1, kind: annual, covers_year: 2025, filing_date: 2026-07-18, amendment: 0, source_url: "https://example.test/so/"}
          - {source: senate_efd, doc_id: S_A, bioguide_id: S1, kind: amendment, covers_year: 2024, filing_date: 2025-09-01, amendment: 2, source_url: "https://example.test/sa/"}
          - {source: senate_efd, doc_id: S_N, bioguide_id: S1, kind: new_filer, covers_year: null, filing_date: 2025-02-03, amendment: 0, source_url: "https://example.test/sn/"}
    expect:
      rows:
        - {doc_id: "10066620", kind: annual, label: Annual report for 2024, extended_on: 2025-04-23}
        - {doc_id: "10076278", kind: annual, label: Annual report for 2025, extended_on: null}
        - {doc_id: "8221318", kind: amendment, label: Amended report for 2024, extended_on: null}
        - {doc_id: "30099999", kind: extension, label: "Report for 2026: not filed yet", extended_on: 2027-05-10}
        - {doc_id: S_O, kind: annual, label: Annual report for 2025, extended_on: 2026-03-17}
        - {doc_id: S_A, kind: amendment, label: "Amended annual report for 2024 (amendment 2)", extended_on: null}
        - {doc_id: S_N, kind: new_filer, label: New member report, extended_on: null}

  # ADR 0028: what is inside a read report.
  - name: stg_annual_report_assets_reads_values
    model: stg_annual_report_assets
    given:
      - input: source('raw', 'annual_report_row')
        format: sql
        rows: |
          select 'senate_efd' as source, 'D1' as doc_id, '3' as part, 1 as row_index, 'S1' as bioguide_id, now() as fetched_at,
                 '{"cells": [{"text": "1", "notes": []}, {"text": "Spouse plan", "notes": ["Filer comment: a 401k"]}, {"text": "Retirement Plans", "notes": ["IRA"]}, {"text": "Spouse", "notes": []}, {"text": "--", "notes": []}, {"text": "", "notes": []}, {"text": "", "notes": []}]}'::jsonb as payload
          union all
          select 'senate_efd', 'D1', '3', 2, 'S1', now(),
                 '{"cells": [{"text": "1.1", "notes": []}, {"text": "Fund A", "notes": []}, {"text": "Mutual Funds", "notes": ["Mutual Fund"]}, {"text": "Spouse", "notes": []}, {"text": "$15,001 - $50,000", "notes": []}, {"text": "Dividends", "notes": []}, {"text": "$201 - $1,000", "notes": []}]}'::jsonb
          union all
          select 'senate_efd', 'D1', '3', 3, 'S1', now(),
                 '{"cells": [{"text": "2", "notes": []}, {"text": "Checking", "notes": []}, {"text": "Bank Deposit", "notes": []}, {"text": "Joint", "notes": []}, {"text": "None (or less than $1,001)", "notes": []}, {"text": "Interest", "notes": []}, {"text": "None (or less than $201)", "notes": []}]}'::jsonb
          union all
          select 'senate_efd', 'D1', '3', 4, 'S1', now(),
                 '{"cells": [{"text": "3", "notes": []}, {"text": "Ranch", "notes": []}, {"text": "Real Estate", "notes": ["Unimproved Land"]}, {"text": "Self", "notes": []}, {"text": "Over $50,000,000", "notes": []}, {"text": "Rent/Royalties", "notes": []}, {"text": "$1,001 - $2,500", "notes": []}]}'::jsonb
          union all
          select 'senate_efd', 'D1', '3', 5, 'S1', now(),
                 '{"cells": [{"text": "4", "notes": []}, {"text": "Family LLC", "notes": []}, {"text": "Business Entity", "notes": []}, {"text": "Child", "notes": []}, {"text": "Unascertainable", "notes": []}, {"text": "", "notes": []}, {"text": "", "notes": []}]}'::jsonb
          union all
          select 'senate_efd', 'D1', '7', 1, 'S1', now(), '{"cells": []}'::jsonb
    expect:
      rows:
        - {row_label: "1", parent_label: null, asset_name: Spouse plan, asset_notes: "Filer comment: a 401k", asset_category: Retirement Plans, asset_subtype: IRA, owner_code: SP, value_kind: not_valued, value_low: null, value_high: null, income_type: null}
        - {row_label: "1.1", parent_label: "1", asset_name: Fund A, asset_notes: null, asset_category: Mutual Funds, asset_subtype: Mutual Fund, owner_code: SP, value_kind: band, value_low: "15001.00", value_high: "50000.00", income_type: Dividends}
        - {row_label: "2", parent_label: null, asset_name: Checking, asset_notes: null, asset_category: Bank Deposit, asset_subtype: null, owner_code: JT, value_kind: none, value_low: 0, value_high: "1000.00", income_type: Interest}
        - {row_label: "3", parent_label: null, asset_name: Ranch, asset_notes: null, asset_category: Real Estate, asset_subtype: Unimproved Land, owner_code: SELF, value_kind: top_band, value_low: "50000000.00", value_high: null, income_type: Rent/Royalties}
        - {row_label: "4", parent_label: null, asset_name: Family LLC, asset_notes: null, asset_category: Business Entity, asset_subtype: null, owner_code: DC, value_kind: unascertainable, value_low: null, value_high: null, income_type: null}

  - name: annual_report_version_takes_the_latest_amendment
    model: annual_report_version
    given:
      - input: ref('member')
        rows:
          - {bioguide_id: S1}
      - input: ref('stg_annual_disclosures')
        rows:
          - {source: senate_efd, doc_id: ORIG, bioguide_id: S1, kind: annual, covers_year: 2025, amendment: 0, filing_date: 2026-05-15, source_url: "https://example.test/o/"}
          - {source: senate_efd, doc_id: AM1, bioguide_id: S1, kind: amendment, covers_year: 2025, amendment: 1, filing_date: 2026-08-20, source_url: "https://example.test/a1/"}
          - {source: senate_efd, doc_id: AM2, bioguide_id: S1, kind: amendment, covers_year: 2025, amendment: 2, filing_date: 2026-08-24, source_url: "https://example.test/a2/"}
          # The 2024 amendment did not read, so the original stands for 2024.
          - {source: senate_efd, doc_id: OLD, bioguide_id: S1, kind: annual, covers_year: 2024, amendment: 0, filing_date: 2025-05-15, source_url: "https://example.test/old/"}
          - {source: senate_efd, doc_id: OLDAM, bioguide_id: S1, kind: amendment, covers_year: 2024, amendment: 1, filing_date: 2025-10-10, source_url: "https://example.test/oldam/"}
      - input: source('raw', 'annual_report_page')
        rows:
          - {source: senate_efd, doc_id: ORIG, status: parsed}
          - {source: senate_efd, doc_id: AM1, status: parsed}
          - {source: senate_efd, doc_id: AM2, status: parsed}
          - {source: senate_efd, doc_id: OLD, status: parsed}
          - {source: senate_efd, doc_id: OLDAM, status: failed}
    expect:
      rows:
        - {covers_year: 2024, doc_id: OLD}
        - {covers_year: 2025, doc_id: AM2}

  - name: annual_net_worth_sums_bands_and_skips_accounts
    model: annual_net_worth
    given:
      - input: ref('annual_report_version')
        rows:
          - {bioguide_id: S1, source: senate_efd, covers_year: 2025, doc_id: D1, kind: annual, amendment: 0, filing_date: 2026-08-13, source_url: "https://example.test/d1/"}
          - {bioguide_id: S2, source: senate_efd, covers_year: 2025, doc_id: D2, kind: annual, amendment: 0, filing_date: 2026-05-14, source_url: "https://example.test/d2/"}
      - input: ref('annual_asset')
        rows:
          # An account counts nothing; its holding does. "None" counts 0 to 1,000.
          - {doc_id: D1, is_account: true, counts_in_total: false, value_kind: not_valued, value_low: null, value_high: null}
          - {doc_id: D1, is_account: false, counts_in_total: true, value_kind: band, value_low: 15001, value_high: 50000}
          - {doc_id: D1, is_account: false, counts_in_total: true, value_kind: none, value_low: 0, value_high: 1000}
          - {doc_id: D1, is_account: false, counts_in_total: false, value_kind: unascertainable, value_low: null, value_high: null}
          # A top band leaves the high end open.
          - {doc_id: D2, is_account: false, counts_in_total: true, value_kind: top_band, value_low: 50000000, value_high: null}
      - input: ref('annual_liability')
        rows:
          - {doc_id: D1, amount_kind: band, amount_low: 100001, amount_high: 250000}
    expect:
      rows:
        - {doc_id: D1, holdings: 2, unascertainable: 1, assets_low: 15001, assets_high: 51000, assets_high_is_open: false, liabilities: 1, liabilities_low: "100001.00", liabilities_high: "250000.00", net_low: "-234999.00", net_high: "-49001.00"}
        - {doc_id: D2, holdings: 1, unascertainable: 0, assets_low: 50000000, assets_high: "0", assets_high_is_open: true, liabilities: 0, liabilities_low: 0, liabilities_high: 0, net_low: 50000000, net_high: null}

  # ADR 0029: House Schedules A and D.
  - name: stg_house_annual_assets_reads_cells
    model: stg_house_annual_assets
    given:
      - input: source('raw', 'annual_report_row')
        format: sql
        rows: |
          select 'house_clerk' as source, 'H1' as doc_id, 'A' as part, 1 as row_index, 'H0001' as bioguide_id, now() as fetched_at,
                 '{"page": 1, "cells": {"asset": "JP MORGAN SECURITIES LLC BROKERAGE ACCOUNT ⇒ Caterpillar, Inc. (CAT) [ST]", "owner": "", "value": "$50,001 - $100,000", "income_type": "Dividends", "income": "$201 - $1,000", "tx_over_1000": ""}, "detail": {"comments": "NAME CHANGED"}}'::jsonb as payload
          union all
          select 'house_clerk', 'H1', 'A', 2, 'H0001', now(),
                 '{"page": 1, "cells": {"asset": "Family Partnership [OL]", "owner": "JT", "value": "$209,630.10", "income_type": "Partnership", "income": "$15,001 - $50,000", "tx_over_1000": ""}, "detail": {"location": "Houston, TX, US"}}'::jsonb
          union all
          select 'house_clerk', 'H1', 'A', 3, 'H0001', now(),
                 '{"page": 2, "cells": {"asset": "Closed Savings [BA]", "owner": "SP", "value": "None", "income_type": "Interest", "income": "$1 - $200", "tx_over_1000": ""}, "detail": {}}'::jsonb
          union all
          select 'house_clerk', 'H1', 'A', 4, 'H0001', now(),
                 '{"page": 2, "cells": {"asset": "Spouse Trust [TR]", "owner": "SP", "value": "Spouse/DC Over $1,000,000", "income_type": "None", "income": "", "tx_over_1000": ""}, "detail": {}}'::jsonb
          union all
          select 'house_clerk', 'H1', 'A', 5, 'H0001', now(),
                 '{"page": 2, "cells": {"asset": "Startup Shares [PS]", "owner": "DC", "value": "Undetermined", "income_type": "None", "income": "", "tx_over_1000": ""}, "detail": {}}'::jsonb
          union all
          select 'house_clerk', 'H2', 'A', 1, 'H0002', now(),
                 '{"page": 1, "cells": {"asset": "Checking Account [BA]", "owner": "", "value": "$50,001 - $100,000", "income_type": "Interest", "income": "Not Applicable", "income_preceding": "$1 - $200"}, "detail": {"description": "Starion Bank"}}'::jsonb
          union all
          select 'senate_efd', 'S1', '3', 1, 'S0001', now(), '{"cells": []}'::jsonb
    expect:
      rows:
        - {doc_id: H1, row_index: 1, held_in: JP MORGAN SECURITIES LLC BROKERAGE ACCOUNT, asset_name: "Caterpillar, Inc. (CAT)", asset_code: ST, asset_notes: "Comments: NAME CHANGED", owner_code: SELF, value_kind: band, value_low: "50001.00", value_high: "100000.00", income_raw: "$201 - $1,000"}
        - {doc_id: H1, row_index: 2, held_in: null, asset_name: Family Partnership, asset_code: OL, asset_notes: "Location: Houston, TX, US", owner_code: JT, value_kind: exact, value_low: "209630.10", value_high: "209630.10", income_raw: "$15,001 - $50,000"}
        # The House scale has its own $1 - $1,000 band, so "None" is no value at all.
        - {doc_id: H1, row_index: 3, held_in: null, asset_name: Closed Savings, asset_code: BA, asset_notes: null, owner_code: SP, value_kind: none, value_low: 0, value_high: 0, income_raw: "$1 - $200"}
        - {doc_id: H1, row_index: 4, held_in: null, asset_name: Spouse Trust, asset_code: TR, asset_notes: null, owner_code: SP, value_kind: top_band, value_low: "1000000.00", value_high: null, income_raw: null}
        - {doc_id: H1, row_index: 5, held_in: null, asset_name: Startup Shares, asset_code: PS, asset_notes: null, owner_code: DC, value_kind: unascertainable, value_low: null, value_high: null, income_raw: null}
        # A new member's report: the preceding year's income stands in for "Not Applicable".
        - {doc_id: H2, row_index: 1, held_in: null, asset_name: Checking Account, asset_code: BA, asset_notes: "Description: Starion Bank", owner_code: SELF, value_kind: band, value_low: "50001.00", value_high: "100000.00", income_raw: "$1 - $200"}

  - name: stg_house_annual_liabilities_reads_cells
    model: stg_house_annual_liabilities
    given:
      - input: source('raw', 'annual_report_row')
        format: sql
        rows: |
          select 'house_clerk' as source, 'H1' as doc_id, 'D' as part, 1 as row_index, 'H0001' as bioguide_id, now() as fetched_at,
                 '{"page": 4, "cells": {"owner": "", "creditor": "JOHNSON BANK, JANESVILLE, WI", "date_incurred": "OCTOBER 2014", "type": "MORTGAGE ON PERSONAL RESIDENCE", "amount": "$15,001 - $50,000"}, "detail": {}}'::jsonb as payload
          union all
          select 'house_clerk', 'H1', 'D', 2, 'H0001', now(),
                 '{"page": 4, "cells": {"owner": "SP", "creditor": "United Bank", "date_incurred": "2019", "type": "Personal Loan", "amount": "Spouse/DC Over $1,000,000"}, "detail": {}}'::jsonb
          union all
          select 'house_clerk', 'H1', 'D', 3, 'H0001', now(),
                 '{"page": 4, "cells": {"owner": "JT", "creditor": "Credit Union", "date_incurred": "2021", "type": "Auto loan", "amount": "$16,508.00"}, "detail": {}}'::jsonb
    expect:
      rows:
        - {row_index: 1, owner_code: SELF, creditor: "JOHNSON BANK, JANESVILLE, WI", incurred: OCTOBER 2014, liability_type: MORTGAGE ON PERSONAL RESIDENCE, amount_kind: band, amount_low: "15001.00", amount_high: "50000.00"}
        - {row_index: 2, owner_code: SP, creditor: United Bank, incurred: "2019", liability_type: Personal Loan, amount_kind: top_band, amount_low: "1000000.00", amount_high: null}
        - {row_index: 3, owner_code: JT, creditor: Credit Union, incurred: "2021", liability_type: Auto loan, amount_kind: exact, amount_low: "16508.00", amount_high: "16508.00"}

  # ADR 0030: the rest of a Senate report.
  - name: stg_annual_report_income_reads_amounts
    model: stg_annual_report_income
    given:
      - input: source('raw', 'annual_report_row')
        format: sql
        rows: |
          select 'senate_efd' as source, 'D1' as doc_id, '2' as part, 1 as row_index, 'S1' as bioguide_id, now() as fetched_at,
                 '{"cells": [{"text": "", "notes": []}, {"text": "1", "notes": []}, {"text": "Self", "notes": []}, {"text": "Other", "notes": ["((Required Minimum Distribution))"]}, {"text": "Mitch IRA", "notes": ["Louisville, Kentucky"]}, {"text": "$12,476.28", "notes": []}, {"text": "", "notes": ["n/a"]}]}'::jsonb as payload
          union all
          select 'senate_efd', 'D1', '2', 2, 'S1', now(),
                 '{"cells": [{"text": "", "notes": []}, {"text": "2", "notes": []}, {"text": "Spouse", "notes": []}, {"text": "Board Compensation", "notes": []}, {"text": "Kroger", "notes": ["Cincinnati, Ohio"]}, {"text": "> $1,000", "notes": []}, {"text": "", "notes": ["All deferred in 2025."]}]}'::jsonb
          union all
          select 'senate_efd', 'D1', '3', 1, 'S1', now(), '{"cells": []}'::jsonb
    expect:
      rows:
        - {row_index: 1, owner_code: SELF, income_type: Other, income_detail: "(Required Minimum Distribution)", payer: Mitch IRA, payer_location: "Louisville, Kentucky", amount_kind: exact, amount_low: "12476.28", amount_high: "12476.28", comments: null}
        - {row_index: 2, owner_code: SP, income_type: Board Compensation, income_detail: null, payer: Kroger, payer_location: "Cincinnati, Ohio", amount_kind: over, amount_low: "1000.00", amount_high: null, comments: All deferred in 2025.}

  - name: stg_annual_report_positions_keeps_the_wording
    model: stg_annual_report_positions
    given:
      - input: source('raw', 'annual_report_row')
        format: sql
        rows: |
          select 'senate_efd' as source, 'D1' as doc_id, '8' as part, 1 as row_index, 'S1' as bioguide_id, now() as fetched_at,
                 '{"cells": [{"text": "", "notes": []}, {"text": "1", "notes": []}, {"text": "Dec 1997 to present", "notes": []}, {"text": "Other (Member Manager)", "notes": []}, {"text": "Family LLC", "notes": ["Oshkosh, WI"]}, {"text": "Other (Limited Liability Company)", "notes": []}, {"text": "", "notes": ["n/a"]}]}'::jsonb as payload
          union all
          select 'senate_efd', 'D1', '8', 2, 'S1', now(),
                 '{"cells": [{"text": "", "notes": []}, {"text": "2", "notes": []}, {"text": "Feb 2017 to May 2025", "notes": []}, {"text": "Officer", "notes": []}, {"text": "Pin Point", "notes": ["Holly, Michigan"]}, {"text": "Company", "notes": []}, {"text": "", "notes": ["Closed in May 2025."]}]}'::jsonb
    expect:
      rows:
        - {row_index: 1, is_current: true, position_held: Member Manager, entity: Family LLC, entity_type: Limited Liability Company, comments: null}
        - {row_index: 2, is_current: false, position_held: Officer, entity: Pin Point, entity_type: Company, comments: Closed in May 2025.}
