version: 2

models:
  - name: constituency
    description: One row per state (district null) and per current House district.
    columns:
      - name: fips_state
        tests: [not_null]
      - name: label
        tests: [unique, not_null]
      - name: source
        tests: [not_null]
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: member
    description: One row per tracked member with biography and external ids.
    columns:
      - name: bioguide_id
        tests: [unique, not_null]
      - name: official_full_name
        tests: [not_null]
      - name: birthday
        tests: [not_null]
      - name: gender
        tests:
          - accepted_values: { arguments: { values: ["M", "F"] } }
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: term
    description: Tracked member-terms overlapping the current Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: chamber
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: fips_state
        tests:
          - not_null
          - relationships: { arguments: { to: ref('fips'), field: fips_state } }
      - name: congress
        tests: [not_null]
      - name: end_congress
        tests: [not_null]

  - name: term_history
    description: Every term a tracked member has served, in source order.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: term_index
        tests: [not_null]
      - name: chamber
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]

  - name: leadership_role
    description: Party and chamber leadership roles of tracked members, one row per role and Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: title
        tests: [not_null]
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: start_date
        tests: [not_null]

  - name: committee
    description: All committees and subcommittees; subcommittees point at parent_thomas_id.
    columns:
      - name: thomas_id
        tests: [unique, not_null]
      - name: parent_thomas_id
        tests:
          - relationships: { arguments: { to: ref('committee'), field: thomas_id } }

  - name: committee_membership
    description: Committee assignments of tracked members.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: committee_thomas_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('committee'), field: thomas_id } }

  - name: bill
    description: >
      Bills and amendments sponsored or cosponsored by tracked members, plus every bill a
      loaded roll call references. One detail page each; the counts here are what it shows.
    columns:
      - name: kind
        tests:
          - accepted_values: { arguments: { values: ["bill", "amendment"] } }
      - name: label
        tests: [not_null]
      - name: sponsor_name
        tests: [not_null]
      - name: cosponsor_count
        tests: [not_null]
      - name: action_count
        tests: [not_null]
      - name: summary_count
        tests: [not_null]
      - name: has_summary
        tests: [not_null]
      - name: roll_call_count
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: introduced_date
        tests: [not_null]
      - name: congress_gov_url
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_summary
    description: Every CRS summary version of every bill in mart.bill; is_latest marks the current one.
    columns:
      - name: version_code
        tests: [not_null]
      - name: action_date
        tests: [not_null]
      - name: text_html
        tests: [not_null]
      - name: is_latest
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_cosponsor
    description: Every cosponsor of every bill in mart.bill, tracked members and everyone else.
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: display_name
        tests: [not_null]
      - name: sponsorship_date
        tests: [not_null]
      - name: is_tracked_member
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_sponsorship
    description: Sponsor and cosponsor relationships of tracked members.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: role
        tests:
          - accepted_values: { arguments: { values: ["sponsor", "cosponsor"] } }
      - name: date
        tests: [not_null]

  - name: bill_action
    description: Actions on bills in mart.bill.
    columns:
      - name: action_date
        tests: [not_null]
      - name: action_hash
        tests: [not_null]

  - name: roll_call
    description: Roll-call votes in both chambers with totals computed from member positions.
    columns:
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: vote_date
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: member_vote
    description: Positions of tracked members on every roll call.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: position
        tests:
          - accepted_values: { arguments: { values: ["Yea", "Nay", "Present", "Not Voting", "Other"] } }
      - name: position_raw
        tests: [not_null]

  - name: member_vote_stats
    description: Attendance and party unity per tracked member and Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: positions
        tests: [not_null]

  - name: member_summary
    description: Header panel per tracked member for the current Congress.
    columns:
      - name: bioguide_id
        tests: [unique, not_null]
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: term_end_date
        tests: [not_null]
      - name: term_end_congress
        tests: [not_null]
      - name: tracked_congress
        tests: [not_null]
      - name: chairmanships
        tests: [not_null]
      - name: term_count
        tests: [not_null]
      - name: serving_since_date
        tests: [not_null]
      - name: chamber_term_count
        tests: [not_null]
      - name: chamber_since_date
        tests: [not_null]
      - name: scoring_party
        tests:
          - accepted_values: { arguments: { values: ["R", "D", "I"] } }

  - name: member_feed
    description: Chronological activity events per tracked member.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: event_type
        tests:
          - accepted_values: { arguments: { values: ["vote", "bill_sponsored", "bill_cosponsored", "committee_action"] } }
      - name: event_at
        tests: [not_null]
      - name: event_key
        tests: [not_null]
      - name: headline
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: member_activity_timeline
    description: Weekly event counts per tracked member and event type.
    columns:
      - name: week_start
        tests: [not_null]
      - name: events
        tests: [not_null]

  - name: key_date
    description: Calendar events from the key_dates seed.
    columns:
      - name: date
        tests: [not_null]
      - name: label
        tests: [not_null]

  - name: fec_committee
    description: FEC committees linked to tracked members' current-office candidates, per cycle.
    columns:
      - name: committee_id
        tests: [not_null]
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: designation
        tests:
          - accepted_values: { arguments: { values: ["P", "A", "J", "D", "U", "B"] } }
      - name: fec_url
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: fec_summary
    description: Two-year totals and receipt breakdown per principal campaign committee and cycle.
    columns:
      - name: committee_id
        tests: [not_null]
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: raised
        tests: [not_null]
      - name: spent
        tests: [not_null]
      - name: coverage_end_date
        tests: [not_null]
      - name: fec_url
        tests: [not_null]

  - name: member_fundraising
    description: Fundraising panel row per tracked member and cycle, with a status when data is missing.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: cycle
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["filed", "no_filings", "no_committee", "no_candidate"] } }
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]
