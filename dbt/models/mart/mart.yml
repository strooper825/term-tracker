version: 2

models:
  - name: constituency
    description: One row per state (district null) and per current House district.
    columns:
      - name: fips_state
        tests: [not_null]
      - name: label
        tests: [unique, not_null]
      - name: source
        tests: [not_null]
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: member
    description: One row per tracked member with biography and external ids.
    columns:
      - name: bioguide_id
        tests: [unique, not_null]
      - name: official_full_name
        tests: [not_null]
      - name: birthday
        tests: [not_null]
      - name: gender
        tests:
          - accepted_values: { arguments: { values: ["M", "F"] } }
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: term
    description: Tracked member-terms overlapping the current Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: chamber
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: fips_state
        tests:
          - not_null
          - relationships: { arguments: { to: ref('fips'), field: fips_state } }
      - name: congress
        tests: [not_null]
      - name: end_congress
        tests: [not_null]

  - name: term_history
    description: Every term a tracked member has served, in source order.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: term_index
        tests: [not_null]
      - name: chamber
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]

  - name: leadership_role
    description: Party and chamber leadership roles of tracked members, one row per role and Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: title
        tests: [not_null]
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: start_date
        tests: [not_null]

  - name: committee
    description: All committees and subcommittees; subcommittees point at parent_thomas_id.
    columns:
      - name: thomas_id
        tests: [unique, not_null]
      - name: parent_thomas_id
        tests:
          - relationships: { arguments: { to: ref('committee'), field: thomas_id } }

  - name: committee_membership
    description: Committee assignments of tracked members.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: committee_thomas_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('committee'), field: thomas_id } }

  - name: bill
    description: >
      Bills and amendments sponsored or cosponsored by tracked members, plus every bill a
      loaded roll call references. One detail page each; the counts here are what it shows.
    columns:
      - name: kind
        tests:
          - accepted_values: { arguments: { values: ["bill", "amendment"] } }
      - name: label
        tests: [not_null]
      - name: sponsor_name
        tests: [not_null]
      - name: cosponsor_count
        tests: [not_null]
      - name: action_count
        tests: [not_null]
      - name: summary_count
        tests: [not_null]
      - name: has_summary
        tests: [not_null]
      - name: roll_call_count
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: introduced_date
        tests: [not_null]
      - name: congress_gov_url
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_summary
    description: Every CRS summary version of every bill in mart.bill; is_latest marks the current one.
    columns:
      - name: version_code
        tests: [not_null]
      - name: action_date
        tests: [not_null]
      - name: text_html
        tests: [not_null]
      - name: is_latest
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_cosponsor
    description: Every cosponsor of every bill in mart.bill, tracked members and everyone else.
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: display_name
        tests: [not_null]
      - name: sponsorship_date
        tests: [not_null]
      - name: is_tracked_member
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_sponsorship
    description: Sponsor and cosponsor relationships of tracked members.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: role
        tests:
          - accepted_values: { arguments: { values: ["sponsor", "cosponsor"] } }
      - name: date
        tests: [not_null]

  - name: bill_action
    description: Actions on bills in mart.bill.
    columns:
      - name: action_date
        tests: [not_null]
      - name: action_hash
        tests: [not_null]

  - name: roll_call
    description: Roll-call votes in both chambers with totals computed from member positions.
    columns:
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: vote_date
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: member_vote
    description: Positions of tracked members on every roll call.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: position
        tests:
          - accepted_values: { arguments: { values: ["Yea", "Nay", "Present", "Not Voting", "Other"] } }
      - name: position_raw
        tests: [not_null]

  - name: member_vote_stats
    description: Attendance and party unity per tracked member and Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: positions
        tests: [not_null]

  - name: member_summary
    description: Header panel per tracked member for the current Congress.
    columns:
      - name: bioguide_id
        tests: [unique, not_null]
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: term_end_date
        tests: [not_null]
      - name: term_end_congress
        tests: [not_null]
      - name: tracked_congress
        tests: [not_null]
      - name: chairmanships
        tests: [not_null]
      - name: term_count
        tests: [not_null]
      - name: serving_since_date
        tests: [not_null]
      - name: chamber_term_count
        tests: [not_null]
      - name: chamber_since_date
        tests: [not_null]
      - name: scoring_party
        tests:
          - accepted_values: { arguments: { values: ["R", "D", "I"] } }

  - name: congress_session
    description: One row per session of a Congress with the dates that bound it; the feed's date filter reads its boundaries from here.
    columns:
      - name: congress
        tests: [not_null]
      - name: session
        tests: [not_null]
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: member_feed
    description: Chronological activity events per tracked member.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: event_type
        tests:
          - accepted_values: { arguments: { values: ["vote", "bill_sponsored", "bill_cosponsored", "committee_action"] } }
      - name: event_at
        tests: [not_null]
      - name: event_key
        tests: [not_null]
      - name: headline
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: member_activity_timeline
    description: Weekly event counts per tracked member and event type.
    columns:
      - name: week_start
        tests: [not_null]
      - name: events
        tests: [not_null]

  - name: key_date
    description: Calendar events from the key_dates seed.
    columns:
      - name: date
        tests: [not_null]
      - name: label
        tests: [not_null]

  - name: fec_committee
    description: FEC committees linked to tracked members' current-office candidates, per cycle.
    columns:
      - name: committee_id
        tests: [not_null]
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: designation
        tests:
          - accepted_values: { arguments: { values: ["P", "A", "J", "D", "U", "B"] } }
      - name: fec_url
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: fec_summary
    description: Two-year totals and receipt breakdown per principal campaign committee and cycle.
    columns:
      - name: committee_id
        tests: [not_null]
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: raised
        tests: [not_null]
      - name: spent
        tests: [not_null]
      - name: coverage_end_date
        tests: [not_null]
      - name: fec_url
        tests: [not_null]

  - name: member_fundraising
    description: Fundraising panel row per tracked member and cycle, with a status when data is missing.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: cycle
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["filed", "no_filings", "no_committee", "no_candidate"] } }
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: bill_passage_vote
    description: >
      Passage-type roll calls on bills with a page, with the result read as passed or failed and
      the Yea/Nay split by party letter (ADR 0009). is_latest_in_chamber marks the one the vote
      journey uses.
    columns:
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: passed
        tests: [not_null]
      - name: is_latest_in_chamber
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_journey_stage
    description: >
      One row per stage of a bill's vote journey: Introduced, the chamber votes (origin first),
      To President, Became law, each read from a passage roll call or a Library of Congress
      late-stage action code. Not a bill status (ADR 0003, ADR 0009).
    columns:
      - name: stage_key
        tests:
          - accepted_values: { arguments: { values: ["introduced", "house_vote", "senate_vote", "to_president", "became_law"] } }
      - name: status
        tests:
          - accepted_values: { arguments: { values: ["complete", "passed", "failed", "vetoed", "no_roll_call", "not_recorded", "pending"] } }
      - name: stage_label
        tests: [not_null]
      - name: status_label
        tests: [not_null]
      - name: is_shown
        tests: [not_null]

  - name: chamber_composition
    description: >
      Party split of each chamber, one row per chamber and party group with seats (ADR 0012).
      Hand-maintained seed; seat_pct is what the stacked bar's width is drawn from.
    columns:
      - name: chamber
        tests: [not_null]
      - name: party_group
        tests: [not_null]
      - name: seats
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: chamber_majority
    description: >
      One row per chamber: seated and vacant seats, the majority threshold, the seats caucusing
      with each party, and the margin (ADR 0012).
    columns:
      - name: chamber
        tests: [unique, not_null]
      - name: majority_threshold
        tests: [not_null]
        description: "Seats to control the chamber: seats / 2 + 1, or seats / 2 for the Senate party its Vice President belongs to (ADR 0014)"
      - name: tiebreak_letter
        description: "Senate only: party letter of the Vice President, who breaks ties (ADR 0014)"

  - name: congress_bill_outcome
    description: >
      One row per bill in mart.bill, with the outcome facts the Congress overview counts
      (ADR 0013). Every figure on the page reads all of it.
    columns:
      - name: label
        tests: [not_null]
      - name: outcome
        tests:
          - accepted_values:
              arguments: { values: ["law", "vetoed", "overridden", "adopted", "pending"] }
              config: { where: "outcome is not null" }

  - name: congress_overview
    description: "One row, every aggregate figure on /congress, over every bill in the dataset."
    columns:
      - name: bills_in_dataset
        tests: [not_null]
      - name: tracked_members
        tests: [not_null]
