version: 2

models:
  - name: constituency
    description: One row per state (district null) and per current House district.
    columns:
      - name: fips_state
        tests: [not_null]
      - name: label
        tests: [unique, not_null]
      - name: source
        tests: [not_null]
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: member
    description: One row per tracked member.
    columns:
      - name: bioguide_id
        tests: [unique, not_null]
      - name: official_full_name
        tests: [not_null]
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: term
    description: Tracked member-terms overlapping the current Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: chamber
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: fips_state
        tests:
          - not_null
          - relationships: { arguments: { to: ref('fips'), field: fips_state } }
      - name: congress
        tests: [not_null]
      - name: end_congress
        tests: [not_null]

  - name: committee
    description: All committees and subcommittees; subcommittees point at parent_thomas_id.
    columns:
      - name: thomas_id
        tests: [unique, not_null]
      - name: parent_thomas_id
        tests:
          - relationships: { arguments: { to: ref('committee'), field: thomas_id } }

  - name: committee_membership
    description: Committee assignments of tracked members.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: committee_thomas_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('committee'), field: thomas_id } }

  - name: bill
    description: Bills and amendments sponsored or cosponsored by tracked members.
    columns:
      - name: kind
        tests:
          - accepted_values: { arguments: { values: ["bill", "amendment"] } }
      - name: title
        tests: [not_null]
      - name: introduced_date
        tests: [not_null]
      - name: congress_gov_url
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_sponsorship
    description: Sponsor and cosponsor relationships of tracked members.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: role
        tests:
          - accepted_values: { arguments: { values: ["sponsor", "cosponsor"] } }
      - name: date
        tests: [not_null]

  - name: bill_action
    description: Actions on bills in mart.bill.
    columns:
      - name: action_date
        tests: [not_null]
      - name: action_hash
        tests: [not_null]

  - name: roll_call
    description: Roll-call votes in both chambers with totals computed from member positions.
    columns:
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: vote_date
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: member_vote
    description: Positions of tracked members on every roll call.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: position
        tests:
          - accepted_values: { arguments: { values: ["Yea", "Nay", "Present", "Not Voting", "Other"] } }
      - name: position_raw
        tests: [not_null]

  - name: member_vote_stats
    description: Attendance and party unity per tracked member and Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: positions
        tests: [not_null]

  - name: member_summary
    description: Header panel per tracked member for the current Congress.
    columns:
      - name: bioguide_id
        tests: [unique, not_null]
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: term_end_date
        tests: [not_null]
      - name: term_end_congress
        tests: [not_null]
      - name: tracked_congress
        tests: [not_null]
      - name: chairmanships
        tests: [not_null]

  - name: member_feed
    description: Chronological activity events per tracked member.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: event_type
        tests:
          - accepted_values: { arguments: { values: ["vote", "bill_sponsored", "bill_cosponsored", "committee_action"] } }
      - name: event_at
        tests: [not_null]
      - name: event_key
        tests: [not_null]
      - name: headline
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: member_activity_timeline
    description: Weekly event counts per tracked member and event type.
    columns:
      - name: week_start
        tests: [not_null]
      - name: events
        tests: [not_null]

  - name: key_date
    description: Calendar events from the key_dates seed.
    columns:
      - name: date
        tests: [not_null]
      - name: label
        tests: [not_null]
