version: 2

models:
  - name: constituency
    description: One row per state (district null) and per current House district.
    columns:
      - name: fips_state
        tests: [not_null]
      - name: label
        tests: [unique, not_null]
      - name: source
        tests: [not_null]
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: member
    description: One row per tracked member with biography and external ids.
    columns:
      - name: bioguide_id
        tests: [unique, not_null]
      - name: official_full_name
        tests: [not_null]
      - name: birthday
        tests: [not_null]
      - name: gender
        tests:
          - accepted_values: { arguments: { values: ["M", "F"] } }
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: term
    description: Tracked member-terms overlapping the current Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: chamber
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: fips_state
        tests:
          - not_null
          - relationships: { arguments: { to: ref('fips'), field: fips_state } }
      - name: congress
        tests: [not_null]
      - name: end_congress
        tests: [not_null]

  - name: seat
    description: >
      Every seat someone holds today (House, delegates, Senate), from the latest
      congress-legislators snapshot, whether or not the member is tracked. A vacant seat has no
      row. Feeds the homepage map and member search (ADR 0022).
    columns:
      - name: seat_key
        tests: [unique, not_null]
      - name: bioguide_id
        tests: [unique, not_null]
      - name: chamber
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: state_abbr
        tests: [not_null]
      - name: is_tracked
        tests: [not_null]

  - name: member_contact
    description: >
      How to reach a tracked member: official website, contact form, phone, fax, Washington office
      and mailing address, from the latest congress-legislators term. Null where the source has none.
    columns:
      - name: bioguide_id
        tests:
          - unique
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }

  - name: statement_source
    description: >
      One row per tracked member with somewhere to link: `feed` (releases ingested from the
      office's own feed) or `link` (the tab links out). A member with no row in
      seed.statement_sources is `link` to the press page the probe found, else to the official
      website (link_kind). Counts and dates are zero/null for a link member.
    columns:
      - name: bioguide_id
        tests:
          - unique
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: mode
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["feed", "link"] } }
      - name: link_kind
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["press_page", "official_website"] } }
      - name: press_url
        tests: [not_null]
      - name: label
        tests: [not_null]
      - name: statements
        tests: [not_null]

  - name: statement
    description: >
      Press releases from the official feeds of `feed` members, since the tracked Congress began.
      content_html is verbatim and sanitised by the site.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: guid
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: published_at
        tests: [not_null]
      - name: url
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: stock_trade_filing
    description: >
      One Periodic Transaction Report per row, for tracked members since the tracked Congress
      began: House reports from the Clerk (ADR 0018), Senate reports from eFD (ADR 0026).
      parsed, scanned (paper) or failed; superseded_by names the Senate amendment that
      replaced a report.
    columns:
      - name: doc_id
        tests: [unique, not_null]
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: status
        tests:
          - accepted_values: { arguments: { values: ["parsed", "scanned", "failed"] } }
      - name: source
        tests:
          - accepted_values: { arguments: { values: ["house_clerk_ptr", "senate_efd"] } }
      - name: superseded_by
        tests:
          - relationships: { arguments: { to: ref('stock_trade_filing'), field: doc_id } }
      - name: source_url
        tests: [not_null]

  - name: stock_trade
    description: >
      One transaction of a tracked member's Periodic Transaction Report, House (ADR 0018) or
      Senate (ADR 0026). The amount is the disclosed band, not a figure. A Senate report an
      amendment replaced contributes no rows.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: direction
        tests:
          - accepted_values: { arguments: { values: ["purchase", "sale", "exchange", "other"] } }
      - name: trade_date
        tests: [not_null]
      - name: amount_low
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: trade_committee_overlap
    description: >
      A trade in an industry one of the member's committees oversees under the narrow mapping
      (ADR 0032): one row per trade and committee. A note of overlap, not a finding.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: committee_thomas_id
        tests: [not_null]
      - name: industry
        tests: [not_null]

  - name: member_stock_trades
    description: >
      One row per tracked member: senate_unavailable (eFD never read), no_filings or filed
      (ADR 0018, ADR 0026), with the counts and value-band totals the Stock trades tab shows.
    columns:
      - name: bioguide_id
        tests:
          - unique
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments: { values: ["senate_unavailable", "no_filings", "filed"] }
      - name: lookup_url
        tests: [not_null]

  - name: annual_disclosure
    description: >
      One annual-disclosure report per row (annual, amendment, new member, termination) a
      tracked member filed since the tracked Congress began, both chambers, listed and linked
      (ADR 0027); plus one row per annual report delayed by an extension and not filed yet.
      Extensions are notes (extended_on), not rows of their own.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: doc_id
        tests: [not_null]
      - name: kind
        tests:
          - accepted_values:
              arguments: { values: ["annual", "amendment", "new_filer", "termination", "extension"] }
      - name: label
        tests: [not_null]
      - name: source
        tests:
          - accepted_values: { arguments: { values: ["house_clerk", "senate_efd"] } }
      - name: source_url
        tests: [not_null]

  - name: member_annual_disclosures
    description: >
      One row per tracked member: unavailable, no_filings or filed (ADR 0027), with the counts
      and the check date the annual-disclosure section shows.
    columns:
      - name: bioguide_id
        tests:
          - unique
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: status
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["unavailable", "no_filings", "filed"] } }
      - name: lookup_url
        tests: [not_null]

  - name: annual_report_version
    description: >
      The read report that stands for each member's year: the highest amendment, then the latest
      filed (ADR 0028).
    columns:
      - name: doc_id
        tests: [unique, not_null]

  - name: annual_asset
    description: >
      Asset lines of the report that stands for each member's year (ADR 0028). Values are bands.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: asset_name
        tests: [not_null]

  - name: annual_liability
    description: Liabilities of the report that stands for each member's year (ADR 0028).
    columns:
      - name: bioguide_id
        tests: [not_null]

  - name: annual_income
    description: >
      Earned and non-investment income lines of the report that stands for each member's year (ADR 0030, ADR 0031). Both chambers.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }

  - name: annual_position
    description: >
      Outside positions of the report that stands for each member's year (ADR 0030, ADR 0031). Both chambers.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }

  - name: annual_agreement
    description: >
      Agreements and arrangements of the report that stands for each member's year (ADR 0030, ADR 0031). Both chambers.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }

  - name: annual_gift
    description: >
      Gifts of the report that stands for each member's year (ADR 0030, ADR 0031). Both chambers.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }

  - name: annual_travel
    description: >
      Privately paid travel of the report that stands for each member's year (ADR 0030, ADR 0031). Both chambers.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }

  - name: annual_net_worth
    description: >
      Per member and year with a read report: summed asset and liability bands and the reported
      net-worth range (ADR 0028).
    columns:
      - name: doc_id
        tests: [unique, not_null]

  - name: term_history
    description: Every term a tracked member has served, in source order.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: term_index
        tests: [not_null]
      - name: chamber
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]

  - name: leadership_role
    description: Party and chamber leadership roles of tracked members, one row per role and Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: title
        tests: [not_null]
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: start_date
        tests: [not_null]

  - name: committee
    description: All committees and subcommittees; subcommittees point at parent_thomas_id.
    columns:
      - name: thomas_id
        tests: [unique, not_null]
      - name: parent_thomas_id
        tests:
          - relationships: { arguments: { to: ref('committee'), field: thomas_id } }

  - name: committee_membership
    description: Committee assignments of tracked members.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: committee_thomas_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('committee'), field: thomas_id } }

  - name: bill
    description: >
      Bills and amendments sponsored or cosponsored by tracked members, plus every bill a
      loaded roll call references. One detail page each; the counts here are what it shows.
    columns:
      - name: kind
        tests:
          - accepted_values: { arguments: { values: ["bill", "amendment"] } }
      - name: label
        tests: [not_null]
      - name: sponsor_name
        tests: [not_null]
      - name: cosponsor_count
        tests: [not_null]
      - name: action_count
        tests: [not_null]
      - name: summary_count
        tests: [not_null]
      - name: has_summary
        tests: [not_null]
      - name: roll_call_count
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: introduced_date
        tests: [not_null]
      - name: congress_gov_url
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_summary
    description: Every CRS summary version of every bill in mart.bill; is_latest marks the current one.
    columns:
      - name: version_code
        tests: [not_null]
      - name: action_date
        tests: [not_null]
      - name: text_html
        tests: [not_null]
      - name: is_latest
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_cosponsor
    description: Every cosponsor of every bill in mart.bill, tracked members and everyone else.
    columns:
      - name: bioguide_id
        tests: [not_null]
      - name: display_name
        tests: [not_null]
      - name: sponsorship_date
        tests: [not_null]
      - name: is_tracked_member
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_sponsorship
    description: Sponsor and cosponsor relationships of tracked members.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: role
        tests:
          - accepted_values: { arguments: { values: ["sponsor", "cosponsor"] } }
      - name: date
        tests: [not_null]

  - name: bill_action
    description: Actions on bills in mart.bill.
    columns:
      - name: action_date
        tests: [not_null]
      - name: action_hash
        tests: [not_null]

  - name: roll_call
    description: Roll-call votes in both chambers with totals computed from member positions.
    columns:
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: vote_date
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: member_vote
    description: Positions of tracked members on every roll call.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: position
        tests:
          - accepted_values: { arguments: { values: ["Yea", "Nay", "Present", "Not Voting", "Other"] } }
      - name: position_raw
        tests: [not_null]

  - name: member_vote_stats
    description: Attendance and party unity per tracked member and Congress.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: positions
        tests: [not_null]

  - name: member_summary
    description: Header panel per tracked member for the current Congress.
    columns:
      - name: bioguide_id
        tests: [unique, not_null]
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: term_end_date
        tests: [not_null]
      - name: term_end_congress
        tests: [not_null]
      - name: tracked_congress
        tests: [not_null]
      - name: chairmanships
        tests: [not_null]
      - name: term_count
        tests: [not_null]
      - name: serving_since_date
        tests: [not_null]
      - name: chamber_term_count
        tests: [not_null]
      - name: chamber_since_date
        tests: [not_null]
      - name: scoring_party
        tests:
          - accepted_values: { arguments: { values: ["R", "D", "I"] } }

  - name: congress_session
    description: One row per session of a Congress with the dates that bound it; the feed's date filter reads its boundaries from here.
    columns:
      - name: congress
        tests: [not_null]
      - name: session
        tests: [not_null]
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: member_feed
    description: Chronological activity events per tracked member.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: event_type
        tests:
          - accepted_values: { arguments: { values: ["vote", "bill_sponsored", "bill_cosponsored", "committee_action"] } }
      - name: event_at
        tests: [not_null]
      - name: event_key
        tests: [not_null]
      - name: headline
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: member_activity_timeline
    description: Weekly event counts per tracked member and event type.
    columns:
      - name: week_start
        tests: [not_null]
      - name: events
        tests: [not_null]

  - name: key_date
    description: >
      Calendar events: the key_dates seed, and each state's election calendar for the current
      cycle from the election_dates seed. office and districts are set only on a state row that
      does not apply to every member the state elects.
    columns:
      - name: date
        tests: [not_null]
      - name: label
        tests: [not_null]
      - name: kind
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: fec_committee
    description: FEC committees linked to tracked members' current-office candidates, per cycle.
    columns:
      - name: committee_id
        tests: [not_null]
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: designation
        tests:
          - accepted_values: { arguments: { values: ["P", "A", "J", "D", "U", "B"] } }
      - name: fec_url
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: fec_summary
    description: Two-year totals and receipt breakdown per principal campaign committee and cycle.
    columns:
      - name: committee_id
        tests: [not_null]
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: raised
        tests: [not_null]
      - name: spent
        tests: [not_null]
      - name: coverage_end_date
        tests: [not_null]
      - name: fec_url
        tests: [not_null]

  - name: member_fundraising
    description: Fundraising panel row per tracked member and cycle, with a status when data is missing.
    columns:
      - name: bioguide_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: cycle
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["filed", "no_filings", "no_committee", "no_candidate"] } }
      - name: source_url
        tests: [not_null]
      - name: fetched_at
        tests: [not_null]

  - name: bill_passage_vote
    description: >
      Passage-type roll calls on bills with a page, with the result read as passed or failed and
      the Yea/Nay split by party letter (ADR 0009). is_latest_in_chamber marks the one the vote
      journey uses.
    columns:
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: passed
        tests: [not_null]
      - name: is_latest_in_chamber
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: bill_index
    description: >
      Every bill and amendment of the Congress that raw holds, with or without a detail page:
      the list the /bills browse page filters (ADR 0025). stage is how far it got, from its own
      action codes; is_minor marks what the page hides until asked.
    columns:
      - name: label
        tests: [not_null]
      - name: title
        tests: [not_null]
      - name: stage
        tests:
          - not_null
          - accepted_values: { arguments: { values: [1, 2, 3, 4, 5], quote: false } }
      - name: origin_chamber
        tests:
          - accepted_values: { arguments: { values: ["House", "Senate"] } }
      - name: congress_gov_url
        tests: [not_null]

  - name: bill_journey_stage
    description: >
      One row per stage of a bill's vote journey: Introduced, the chamber votes (origin first),
      To President, Became law, each read from a passage roll call or a Library of Congress
      late-stage action code. Not a bill status (ADR 0003, ADR 0009).
    columns:
      - name: stage_key
        tests:
          - accepted_values: { arguments: { values: ["introduced", "house_vote", "senate_vote", "to_president", "became_law"] } }
      - name: status
        tests:
          - accepted_values: { arguments: { values: ["complete", "passed", "failed", "vetoed", "no_roll_call", "not_recorded", "pending"] } }
      - name: stage_label
        tests: [not_null]
      - name: status_label
        tests: [not_null]
      - name: is_shown
        tests: [not_null]

  - name: chamber_composition
    description: >
      Party split of each chamber, one row per chamber and party group with seats (ADR 0012).
      Hand-maintained seed; seat_pct is what the stacked bar's width is drawn from.
    columns:
      - name: chamber
        tests: [not_null]
      - name: party_group
        tests: [not_null]
      - name: seats
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: chamber_majority
    description: >
      One row per chamber: seated and vacant seats, the majority threshold, the seats caucusing
      with each party, and the margin (ADR 0012).
    columns:
      - name: chamber
        tests: [unique, not_null]
      - name: majority_threshold
        tests: [not_null]
        description: "Seats to control the chamber: seats / 2 + 1, or seats / 2 for the Senate party its Vice President belongs to (ADR 0014)"
      - name: tiebreak_letter
        description: "Senate only: party letter of the Vice President, who breaks ties (ADR 0014)"

  - name: congress_bill_outcome
    description: >
      One row per bill of the Congress (mart.bill_index, with or without a page), with the
      outcome facts the Congress overview counts (ADR 0013). Every figure on the page reads
      all of it.
    columns:
      - name: label
        tests: [not_null]
      - name: outcome
        tests:
          - accepted_values:
              arguments: { values: ["law", "vetoed", "overridden", "adopted", "pending"] }
              config: { where: "outcome is not null" }

  - name: congress_overview
    description: "One row, every aggregate figure on /congress, over every bill in the dataset."
    columns:
      - name: bills_in_dataset
        tests: [not_null]
      - name: tracked_members
        tests: [not_null]

  - name: constituency_demographics
    description: >
      Who lives in a state or House district: population, age, income, education, unemployment,
      poverty and race and ethnicity from the ACS 5-year, each estimate with its margin of error.
    columns:
      - name: acs_year
        tests: [not_null]
      - name: congress
        tests: [not_null]
      - name: fips_state
        tests: [not_null]
      - name: population
        tests: [not_null]

  - name: member_constituency
    description: >
      The constituency each tracked member represents in the tracked Congress (a senator's state,
      a House member's district) with its map as finished SVG data.
    columns:
      - name: bioguide_id
        tests:
          - unique
          - not_null
          - relationships: { arguments: { to: ref('member'), field: bioguide_id } }
      - name: congress
        tests: [not_null]
      - name: label
        tests: [not_null]
      - name: has_map
        tests: [not_null]

  - name: state_seat_holder
    description: >
      Who held each state legislative seat on the States section's day (ADR 0035), one row per
      person in a legislative role that day, party reduced to R, D, I (independent or other) or
      N (nonpartisan). is_seated is false for a person beyond the district's seat count.
    columns:
      - name: person_id
        tests: [unique, not_null]
      - name: party
        tests:
          - accepted_values: { arguments: { values: ["R", "D", "I", "N"] } }
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["upper", "lower", "legislature"] } }

  - name: state_chamber
    description: >
      Each state legislative chamber on the States section's day (ADR 0035): seats, party counts,
      vacancies, the majority and supermajority thresholds, and who controls it.
    columns:
      - name: state
        tests: [not_null]
      - name: control_kind
        tests:
          - accepted_values:
              arguments: { values: ["supermajority", "majority", "coalition", "nonpartisan", "none"] }

  - name: state_government
    description: >
      Each state's government on the States section's day (ADR 0035): the governor (DC's mayor)
      and who controls it, R, D, I, N or split.
    columns:
      - name: state
        tests: [unique, not_null]
      - name: control
        tests:
          - accepted_values: { arguments: { values: ["R", "D", "I", "N", "split"] } }

  - name: state_chamber_party
    description: >
      Seats each party group holds in each state legislative chamber on the States section's day
      (ADR 0035); the segments of the chamber's bar on the site.
    columns:
      - name: party
        tests:
          - accepted_values: { arguments: { values: ["R", "D", "I", "N"] } }
