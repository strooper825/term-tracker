version: 2

# Constructed cases for the outcome logic in congress_bill_outcome (ADR 0013). The live data has
# no veto among tracked-member bills, so the override path is exercised here instead.
unit_tests:
  - name: congress_bill_outcome_outcomes
    model: congress_bill_outcome
    given:
      - input: ref('bill')
        rows:
          - {congress: 119, bill_type: hr, bill_number: "1", kind: bill, label: "H.R. 1", origin_chamber: House}
          - {congress: 119, bill_type: hr, bill_number: "2", kind: bill, label: "H.R. 2", origin_chamber: House}
          - {congress: 119, bill_type: s, bill_number: "3", kind: bill, label: "S. 3", origin_chamber: Senate}
          - {congress: 119, bill_type: hres, bill_number: "4", kind: bill, label: "H.Res. 4", origin_chamber: House}
          - {congress: 119, bill_type: hr, bill_number: "5", kind: bill, label: "H.R. 5", origin_chamber: House}
          - {congress: 119, bill_type: hr, bill_number: "6", kind: bill, label: "H.R. 6", origin_chamber: House}
          - {congress: 119, bill_type: hconres, bill_number: "7", kind: bill, label: "H.Con.Res. 7", origin_chamber: House}
          - {congress: 119, bill_type: hr, bill_number: "8", kind: bill, label: "H.R. 8", origin_chamber: House}
      - input: ref('bill_journey_stage')
        rows:
          - {congress: 119, bill_type: hr, bill_number: "1", stage_key: introduced, status: complete}
          - {congress: 119, bill_type: hr, bill_number: "1", stage_key: house_vote, status: passed}
          - {congress: 119, bill_type: hr, bill_number: "1", stage_key: senate_vote, status: passed}
          - {congress: 119, bill_type: hr, bill_number: "1", stage_key: became_law, status: complete}
          - {congress: 119, bill_type: hr, bill_number: "2", stage_key: introduced, status: complete}
          - {congress: 119, bill_type: hr, bill_number: "2", stage_key: house_vote, status: passed}
          - {congress: 119, bill_type: hr, bill_number: "2", stage_key: senate_vote, status: passed}
          - {congress: 119, bill_type: hr, bill_number: "2", stage_key: became_law, status: vetoed}
          - {congress: 119, bill_type: s, bill_number: "3", stage_key: introduced, status: complete}
          - {congress: 119, bill_type: s, bill_number: "3", stage_key: senate_vote, status: no_roll_call}
          - {congress: 119, bill_type: s, bill_number: "3", stage_key: house_vote, status: passed}
          - {congress: 119, bill_type: s, bill_number: "3", stage_key: became_law, status: complete}
          - {congress: 119, bill_type: hres, bill_number: "4", stage_key: introduced, status: complete}
          - {congress: 119, bill_type: hres, bill_number: "4", stage_key: house_vote, status: passed}
          - {congress: 119, bill_type: hr, bill_number: "5", stage_key: introduced, status: complete}
          - {congress: 119, bill_type: hr, bill_number: "5", stage_key: house_vote, status: pending}
          - {congress: 119, bill_type: hr, bill_number: "5", stage_key: senate_vote, status: pending}
          - {congress: 119, bill_type: hr, bill_number: "5", stage_key: became_law, status: pending}
          - {congress: 119, bill_type: hconres, bill_number: "7", stage_key: introduced, status: complete}
          - {congress: 119, bill_type: hconres, bill_number: "7", stage_key: house_vote, status: pending}
          - {congress: 119, bill_type: hconres, bill_number: "7", stage_key: senate_vote, status: pending}
          - {congress: 119, bill_type: hr, bill_number: "8", stage_key: introduced, status: complete}
          - {congress: 119, bill_type: hr, bill_number: "8", stage_key: house_vote, status: passed}
          - {congress: 119, bill_type: hr, bill_number: "8", stage_key: senate_vote, status: passed}
          - {congress: 119, bill_type: hr, bill_number: "8", stage_key: to_president, status: pending}
          - {congress: 119, bill_type: hr, bill_number: "8", stage_key: became_law, status: pending}
      - input: ref('bill_action')
        format: sql
        rows: |
          select 119 as congress, 'hr' as bill_type, '1' as bill_number, 'E30000' as action_code, 'President' as action_type, 'Vetoed by President.' as action_text, '2025-12-29'::date as action_date
          union all
          select 119 as congress, 'hr' as bill_type, '1' as bill_number, 'E40000' as action_code, 'BecameLaw' as action_type, 'Became Public Law No: 119-99.' as action_text, '2026-01-20'::date as action_date
          union all
          select 119 as congress, 'hr' as bill_type, '2' as bill_number, 'E30000' as action_code, 'President' as action_type, 'Vetoed by President.' as action_text, '2025-12-29'::date as action_date
          union all
          select 119 as congress, 's' as bill_type, '3' as bill_number, 'E30000' as action_code, 'President' as action_type, 'Signed by President.' as action_text, '2026-02-02'::date as action_date
          union all
          select 119 as congress, 's' as bill_type, '3' as bill_number, 'E40000' as action_code, 'BecameLaw' as action_type, 'Became Public Law No: 119-12.' as action_text, '2026-02-02'::date as action_date
          union all
          select 119 as congress, 'hr' as bill_type, '5' as bill_number, '1000' as action_code, 'IntroReferral' as action_type, 'Introduced in House' as action_text, '2025-03-01'::date as action_date
          union all
          select 119 as congress, 's' as bill_type, '3' as bill_number, '17000' as action_code, 'Floor' as action_type, 'Passed/agreed to in Senate: Passed Senate by Unanimous Consent.' as action_text, '2026-01-20'::date as action_date
          union all
          select 119 as congress, 'hconres' as bill_type, '7' as bill_number, '8000' as action_code, 'Floor' as action_type, 'Passed/agreed to in House: agreed to by voice vote.' as action_text, '2026-03-01'::date as action_date
          union all
          select 119 as congress, 'hconres' as bill_type, '7' as bill_number, '17000' as action_code, 'Floor' as action_type, 'Passed/agreed to in Senate: agreed to without amendment.' as action_text, '2026-03-09'::date as action_date
      - input: ref('bill_passage_vote')
        rows:
          - {congress: 119, bill_type: hr, bill_number: "1", chamber: house, is_latest_in_chamber: true, yea_total: 290, nay_total: 130}
          - {congress: 119, bill_type: hr, bill_number: "1", chamber: senate, is_latest_in_chamber: true, yea_total: 70, nay_total: 30}
    expect:
      rows:
        - {bill_number: "1", passed_a_chamber: true, passed_both_chambers: true, became_law: true, vetoed: true, veto_overridden: true, outcome: overridden, public_law_number: "119-99"}
        - {bill_number: "2", passed_a_chamber: true, passed_both_chambers: true, became_law: false, vetoed: true, veto_overridden: false, outcome: vetoed, public_law_number: null}
        - {bill_number: "3", passed_a_chamber: true, passed_both_chambers: true, became_law: true, vetoed: false, veto_overridden: false, outcome: law, public_law_number: "119-12"}
        - {bill_number: "4", passed_a_chamber: true, passed_both_chambers: false, became_law: false, vetoed: false, veto_overridden: false, outcome: null, public_law_number: null}
        - {bill_number: "5", passed_a_chamber: false, passed_both_chambers: false, became_law: false, vetoed: false, veto_overridden: false, outcome: null, public_law_number: null}
        - {bill_number: "6", passed_a_chamber: false, passed_both_chambers: false, became_law: false, vetoed: false, veto_overridden: false, outcome: null, public_law_number: null}
        - {bill_number: "7", passed_a_chamber: true, passed_both_chambers: true, became_law: false, vetoed: false, veto_overridden: false, outcome: adopted, public_law_number: null}
        - {bill_number: "8", passed_a_chamber: true, passed_both_chambers: true, became_law: false, vetoed: false, veto_overridden: false, outcome: pending, public_law_number: null}

  # How far a bill got, read from its own action codes (ADR 0025), and what the browse page
  # hides until asked. Voice votes leave no roll call, so the stage must not depend on one.
  - name: bill_index_stage_and_minor
    model: bill_index
    overrides:
      vars:
        current_congress: 119
    given:
      - input: source('raw', 'bill')
        format: sql
        rows: |
          select 119 as congress, 'hr' as bill_type, '1' as bill_number, 'bill' as kind, '{"title": "Introduced only", "introducedDate": "2025-01-03"}'::jsonb as payload, 'u' as source_url, now() as fetched_at
          union all select 119, 'hr', '2', 'bill', '{"title": "Reported"}'::jsonb, 'u', now()
          union all select 119, 's', '3', 'bill', '{"title": "Passed the Senate"}'::jsonb, 'u', now()
          union all select 119, 'hr', '4', 'bill', '{"title": "Passed both"}'::jsonb, 'u', now()
          union all select 119, 'hr', '5', 'bill', '{"title": "A law"}'::jsonb, 'u', now()
          union all select 119, 'hr', '6', 'bill', '{"title": "To designate the facility of the United States Postal Service located at 1 Main Street as the Example Post Office"}'::jsonb, 'u', now()
          union all select 119, 'hres', '7', 'bill', '{"title": "A simple resolution"}'::jsonb, 'u', now()
          union all select 119, 'samdt', '8', 'amendment', '{"purpose": "To amend"}'::jsonb, 'u', now()
          union all select 118, 'hr', '9', 'bill', '{"title": "Another Congress"}'::jsonb, 'u', now()
      - input: source('raw', 'bill_actions')
        format: sql
        rows: |
          select 119 as congress, 'hr' as bill_type, '1' as bill_number, '[{"actionCode": "1000"}]'::jsonb as payload
          union all select 119, 'hr', '2', '[{"actionCode": "1000"}, {"actionCode": "5000"}]'::jsonb
          union all select 119, 's', '3', '[{"actionCode": "14000"}, {"actionCode": "17000"}]'::jsonb
          union all select 119, 'hr', '4', '[{"actionCode": "8000"}, {"actionCode": "17000"}]'::jsonb
          union all select 119, 'hr', '5', '[{"actionCode": "8000"}, {"actionCode": "E20000"}, {"actionCode": "36000"}]'::jsonb
          union all select 119, 'hr', '6', '[{"actionCode": "8000"}]'::jsonb
          union all select 119, 'hres', '7', '[]'::jsonb
      - input: ref('stg_bill_cosponsors')
        rows:
          - {congress: 119, bill_type: hr, bill_number: "1", party: D, withdrawn_date: null}
          - {congress: 119, bill_type: hr, bill_number: "1", party: R, withdrawn_date: null}
          - {congress: 119, bill_type: hr, bill_number: "1", party: R, withdrawn_date: "2025-02-01"}
      - input: ref('roll_call')
        rows:
          - {congress: 119, bill_type: hr, bill_number: "5"}
          - {congress: 119, bill_type: null, bill_number: null}
      - input: ref('stg_bill_scope')
        rows:
          - {congress: 119, bill_type: hr, bill_number: "1"}
    expect:
      rows:
        - {bill_type: hr, bill_number: "1", stage: 1, has_floor_vote: false, is_minor: false, has_page: true, cosponsor_count: 2, cosponsors_republican: 1}
        - {bill_type: hr, bill_number: "2", stage: 2, has_floor_vote: false, is_minor: false, has_page: false, cosponsor_count: 0, cosponsors_republican: 0}
        - {bill_type: s, bill_number: "3", stage: 3, has_floor_vote: false, is_minor: false, has_page: false, cosponsor_count: 0, cosponsors_republican: 0}
        - {bill_type: hr, bill_number: "4", stage: 4, has_floor_vote: false, is_minor: false, has_page: false, cosponsor_count: 0, cosponsors_republican: 0}
        - {bill_type: hr, bill_number: "5", stage: 5, has_floor_vote: true, is_minor: false, has_page: false, cosponsor_count: 0, cosponsors_republican: 0}
        - {bill_type: hr, bill_number: "6", stage: 3, has_floor_vote: false, is_minor: true, has_page: false, cosponsor_count: 0, cosponsors_republican: 0}
        - {bill_type: hres, bill_number: "7", stage: 1, has_floor_vote: false, is_minor: true, has_page: false, cosponsor_count: 0, cosponsors_republican: 0}
        - {bill_type: samdt, bill_number: "8", stage: 1, has_floor_vote: false, is_minor: true, has_page: false, cosponsor_count: 0, cosponsors_republican: 0}

