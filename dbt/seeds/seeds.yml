version: 2

seeds:
  - name: fips
    description: >
      Census state FIPS reference (https://www2.census.gov/geo/docs/reference/state.txt),
      retrieved 2026-09-12. States, DC, and territories. Column names follow the Census file.
    config:
      column_types:
        fips_state: text
        state_abbr: text
        state_name: text
        statens: text
    columns:
      - name: fips_state
        tests: [unique, not_null]
      - name: state_abbr
        tests: [unique, not_null]

  - name: tracked_members
    description: Members in scope for ingestion and the mart (plan section 3, principle 5).
    config:
      column_types:
        bioguide_id: text
        note: text
    columns:
      - name: bioguide_id
        tests: [unique, not_null]

  - name: key_dates
    description: >
      Hand-maintained calendar (plan section 4, key_date): elections, session boundaries,
      filing deadlines. scope is congress, chamber, state, or member; scope_value is the chamber
      name, state abbreviation, or bioguide id. Provenance per row in source_url; retrieval date
      is the dbt var key_dates_fetched_at. Recesses are not seeded yet.
    config:
      column_types:
        date: date
        label: text
        kind: text
        scope: text
        scope_value: text
        note: text
        source_url: text
    columns:
      - name: date
        tests: [not_null]
      - name: label
        tests: [not_null]
      - name: scope
        tests:
          - accepted_values: { arguments: { values: ["congress", "chamber", "state", "member"] } }
      - name: source_url
        tests: [not_null]

  - name: statement_sources
    description: >
      How the Public statements tab treats each tracked member (ADR 0015). mode `feed`: the
      office's own press-release RSS feed (feed_url) is ingested and the releases shown; mode
      `link`: the tab links to press_url. A member is `feed` only after a person checked that the
      feed is press-scoped, carries full text, and matches the listing's newest item. press_url
      is the office's press listing, checked to load. Hand-maintained; the note records the check.
    config:
      column_types:
        bioguide_id: text
        mode: text
        label: text
        press_url: text
        feed_url: text
        note: text
    columns:
      - name: bioguide_id
        tests:
          - unique
          - not_null
          - relationships: { arguments: { to: ref('tracked_members'), field: bioguide_id } }
      - name: mode
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["feed", "link"] } }
      - name: press_url
        tests: [not_null]
      - name: label
        tests: [not_null]

  - name: ptr_transaction_types
    description: >
      Transaction-type codes printed on a House Periodic Transaction Report (ADR 0018), with the
      direction the mart groups them by. `S (partial)` is a partial sale, printed as such.
    config:
      column_types:
        code: text
        label: text
        direction: text
    columns:
      - name: code
        tests: [unique, not_null]
      - name: direction
        tests:
          - accepted_values: { arguments: { values: ["purchase", "sale", "exchange"] } }

  - name: ptr_owner_codes
    description: >
      Owner codes on a House PTR (ADR 0018). A blank owner cell is the filer; the staging model
      writes it as SELF.
    config:
      column_types:
        code: text
        label: text
    columns:
      - name: code
        tests: [unique, not_null]

  - name: ptr_asset_types
    description: >
      Asset-type codes the Clerk defines (https://fd.house.gov/reference/asset-type-codes.aspx,
      copied 2026-09-20; ADR 0018). Every code the Clerk lists is here, whether or not a
      tracked member has used it.
    config:
      column_types:
        code: text
        label: text
    columns:
      - name: code
        tests: [unique, not_null]

  - name: composition_seats
    description: >
      Hand-maintained party split of the 435 House and 100 Senate seats (ADR 0012), one row per
      chamber and party group. No ingested source lists vacancies, so this is typed by hand from
      the Clerk of the House and Senate.gov and cross-checked against raw.legislator by the
      warning test assert_composition_matches_legislators. Provenance is the dbt vars
      composition_as_of, composition_house_source_url and composition_senate_source_url.
    config:
      column_types:
        chamber: text
        party_group: text
        seats: integer
        caucus_with: text
    columns:
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: party_group
        tests:
          - accepted_values:
              arguments: { values: ["republican", "democratic", "independent", "vacant"] }
      - name: seats
        tests: [not_null]
      - name: caucus_with
        tests:
          - accepted_values:
              arguments: { values: ["republican", "democratic"], quote: true }
              config: { where: "caucus_with is not null" }
