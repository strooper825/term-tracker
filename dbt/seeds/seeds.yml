version: 2

seeds:
  - name: fips
    description: >
      Census state FIPS reference (https://www2.census.gov/geo/docs/reference/state.txt),
      retrieved 2026-09-12. States, DC, and territories. Column names follow the Census file.
    config:
      column_types:
        fips_state: text
        state_abbr: text
        state_name: text
        statens: text
    columns:
      - name: fips_state
        tests: [unique, not_null]
      - name: state_abbr
        tests: [unique, not_null]

  - name: tracked_members
    description: Members in scope for ingestion and the mart (plan section 3, principle 5).
    config:
      column_types:
        bioguide_id: text
        note: text
    columns:
      - name: bioguide_id
        tests: [unique, not_null]

  - name: key_dates
    description: >
      Hand-maintained calendar (plan section 4, key_date): session boundaries and the general
      election day. The states' primaries and filing deadlines are in election_dates. scope is
      congress, chamber, state, or member; scope_value is the chamber
      name, state abbreviation, or bioguide id. Provenance per row in source_url; retrieval date
      is the dbt var key_dates_fetched_at. Recesses are not seeded yet.
    config:
      column_types:
        date: date
        label: text
        kind: text
        scope: text
        scope_value: text
        note: text
        source_url: text
    columns:
      - name: date
        tests: [not_null]
      - name: label
        tests: [not_null]
      - name: scope
        tests:
          - accepted_values: { arguments: { values: ["congress", "chamber", "state", "member"] } }
      - name: source_url
        tests: [not_null]

  - name: election_dates
    description: >
      The states' congressional election calendars (ADR 0023): one row per cycle, state, office,
      districts, event and date. office is blank when the date is the same for the House and
      the Senate, else house or senate; districts (space-separated numbers) is set only when a
      House date applies to some districts of the state. event is filing_deadline, primary,
      primary_runoff or general_runoff; the general election day itself is one national row in
      key_dates. qualifier is a short tag shown in the label (noon, incumbents, if needed).
      basis is official (published by the state or the FEC), statutory (worked out from the
      rule) or projected. rule is the statute or the reason, where a person wrote one down.
      2026 is from the FEC's "2026 Congressional Primary Dates and Candidate Filing Deadlines
      for Ballot Access" (data as of 2026-05-18), whose primary and runoff dates agree with
      NCSL's table of 2026-05-27; Arkansas's filing deadline is the state's.
    config:
      column_types:
        cycle: integer
        state: text
        office: text
        districts: text
        event: text
        date: date
        qualifier: text
        basis: text
        rule: text
        source_url: text
        checked_on: date
    columns:
      - name: cycle
        tests: [not_null]
      - name: state
        tests:
          - not_null
          - relationships: { arguments: { to: ref('fips'), field: state_abbr } }
      - name: office
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: event
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["filing_deadline", "primary", "primary_runoff", "general_runoff"]
      - name: date
        tests: [not_null]
      - name: basis
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["official", "statutory", "projected"] } }
      - name: source_url
        tests: [not_null]
      - name: checked_on
        tests: [not_null]

  - name: statement_sources
    description: >
      The members whose statements source a person checked (ADR 0015); a tracked member with no
      row links out by default (ADR 0023, mart.statement_source). mode `feed`: the
      office's own press-release RSS feed (feed_url) is ingested and the releases shown; mode
      `link`: the tab links to press_url. A member is `feed` only after a person checked that the
      feed is press-scoped, carries full text, and matches the listing's newest item. press_url
      is the office's press listing, checked to load. Hand-maintained; the note records the check.
    config:
      column_types:
        bioguide_id: text
        mode: text
        label: text
        press_url: text
        feed_url: text
        note: text
    columns:
      - name: bioguide_id
        tests:
          - unique
          - not_null
          - relationships: { arguments: { to: ref('tracked_members'), field: bioguide_id } }
      - name: mode
        tests:
          - not_null
          - accepted_values: { arguments: { values: ["feed", "link"] } }
      - name: press_url
        tests: [not_null]
      - name: label
        tests: [not_null]

  - name: ptr_transaction_types
    description: >
      Transaction-type codes printed on a House Periodic Transaction Report (ADR 0018), with the
      direction the mart groups them by. `S (partial)` is a partial sale, printed as such.
    config:
      column_types:
        code: text
        label: text
        direction: text
    columns:
      - name: code
        tests: [unique, not_null]
      - name: direction
        tests:
          - accepted_values: { arguments: { values: ["purchase", "sale", "exchange"] } }

  - name: committee_industries
    description: >
      The narrow mapping from a committee to the industries it oversees (ADR 0032): one row per
      committee and range of SIC codes, with a short industry name and the part of the
      committee's jurisdiction the row rests on (a paraphrase of House Rule X, Senate Rule XXV
      and the committee's own description, not a quotation). Core industries only; reviewed by
      the owner line by line and again at each new Congress.
    config:
      column_types:
        committee_thomas_id: text
        sic_from: integer
        sic_to: integer
        industry: text
        basis: text
    columns:
      - name: committee_thomas_id
        tests:
          - not_null
          - relationships: { arguments: { to: ref('committee_industry_scope'), field: committee_thomas_id } }
      - name: sic_from
        tests: [not_null]
      - name: sic_to
        tests: [not_null]

  - name: committee_industry_scope
    description: >
      Every committee and whether committee_industries maps it (ADR 0032), with the reason a
      committee is not mapped (its remit is the whole economy, or it has no legislative
      jurisdiction) or is mapped only in part. The methods page lists both.
    config:
      column_types:
        committee_thomas_id: text
        mapped: boolean
        reason: text
    columns:
      - name: committee_thomas_id
        tests: [unique, not_null]
      - name: mapped
        tests: [not_null]

  - name: ptr_owner_codes
    description: >
      Owner codes on a House PTR (ADR 0018). A blank owner cell is the filer; the staging model
      writes it as SELF.
    config:
      column_types:
        code: text
        label: text
    columns:
      - name: code
        tests: [unique, not_null]

  - name: efd_asset_types
    description: >
      Asset types as the Senate's eFD system prints them on a periodic transaction report
      (ADR 0026), with the label the site shows. Only the values tracked senators' reports
      have used are listed; a new one is kept, shown as printed and flagged
      (has_unmapped_code), and the ingest log names it.
    config:
      column_types:
        code: text
        label: text
    columns:
      - name: code
        tests: [unique, not_null]

  - name: ptr_asset_types
    description: >
      Asset-type codes the Clerk defines (https://fd.house.gov/reference/asset-type-codes.aspx,
      copied 2026-09-20; ADR 0018). Every code the Clerk lists is here, whether or not a
      tracked member has used it.
    config:
      column_types:
        code: text
        label: text
    columns:
      - name: code
        tests: [unique, not_null]

  - name: composition_seats
    description: >
      Hand-maintained party split of the 435 House and 100 Senate seats (ADR 0012), one row per
      chamber and party group. No ingested source lists vacancies, so this is typed by hand from
      the Clerk of the House and Senate.gov and cross-checked against raw.legislator by the
      warning test assert_composition_matches_legislators. Provenance is the dbt vars
      composition_as_of, composition_house_source_url and composition_senate_source_url.
    config:
      column_types:
        chamber: text
        party_group: text
        seats: integer
        caucus_with: text
    columns:
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: party_group
        tests:
          - accepted_values:
              arguments: { values: ["republican", "democratic", "independent", "vacant"] }
      - name: seats
        tests: [not_null]
      - name: caucus_with
        tests:
          - accepted_values:
              arguments: { values: ["republican", "democratic"], quote: true }
              config: { where: "caucus_with is not null" }

  - name: state_chambers
    description: >
      Every state legislative chamber of the 50 states, DC and Puerto Rico (ADR 0035): its name,
      the legislature's name, the member title and the number of voting seats. Generated by
      `python -m ingest.state_maps` from the openstates-core metadata; do not edit by hand.
      chamber is upper, lower, or legislature for a one-chamber body (Nebraska, the DC Council).
    config:
      column_types:
        state: text
        chamber: text
        chamber_name: text
        legislature_name: text
        title: text
        seats: integer
    columns:
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["upper", "lower", "legislature"] } }
      - name: seats
        tests: [not_null]

  - name: state_districts
    description: >
      Every state legislative district (ADR 0035), named as Open States names it, with its number
      of seats and the Census code of its shape in site/public/maps/states/{state}.json. shape is
      blank for a seat with no shape of its own; note says why (at-large, floterial, non-voting).
      Generated by `python -m ingest.state_maps`; do not edit by hand.
    config:
      column_types:
        state: text
        chamber: text
        district: text
        seats: integer
        shape: text
        note: text
    columns:
      - name: note
        tests:
          - accepted_values:
              arguments: { values: ["at-large", "floterial", "non-voting"] }
              config: { where: "note is not null and note <> ''" }

  - name: state_supermajority
    description: >
      Hand-maintained (ADR 0035): the share of a chamber's seats that makes a supermajority, one
      row per state. It is the share needed to override the governor's veto, or two-thirds where
      a simple majority overrides (basis says which). checked is the day the owner confirmed the
      row against the state's constitution; blank rows are drafts.
    config:
      column_types:
        state: text
        numerator: integer
        denominator: integer
        basis: text
        checked: date
    columns:
      - name: state
        tests: [unique, not_null]

  - name: state_control_overrides
    description: >
      Hand-maintained (ADR 0035): chambers run by a cross-party coalition, whatever the seat
      counts say, between from_date and to_date (blank: still in force). control is coalition.
    config:
      column_types:
        state: text
        chamber: text
        from_date: date
        to_date: date
        control: text
        note: text
        source_url: text
        checked: date
    columns:
      - name: control
        tests:
          - accepted_values: { arguments: { values: ["coalition"] } }
