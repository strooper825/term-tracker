version: 2

seeds:
  - name: fips
    description: >
      Census state FIPS reference (https://www2.census.gov/geo/docs/reference/state.txt),
      retrieved 2026-09-12. States, DC, and territories. Column names follow the Census file.
    config:
      column_types:
        fips_state: text
        state_abbr: text
        state_name: text
        statens: text
    columns:
      - name: fips_state
        tests: [unique, not_null]
      - name: state_abbr
        tests: [unique, not_null]

  - name: tracked_members
    description: Members in scope for ingestion and the mart (plan section 3, principle 5).
    config:
      column_types:
        bioguide_id: text
        note: text
    columns:
      - name: bioguide_id
        tests: [unique, not_null]

  - name: key_dates
    description: >
      Hand-maintained calendar (plan section 4, key_date): elections, session boundaries,
      filing deadlines. scope is congress, chamber, state, or member; scope_value is the chamber
      name, state abbreviation, or bioguide id. Provenance per row in source_url; retrieval date
      is the dbt var key_dates_fetched_at. Recesses are not seeded yet.
    config:
      column_types:
        date: date
        label: text
        kind: text
        scope: text
        scope_value: text
        note: text
        source_url: text
    columns:
      - name: date
        tests: [not_null]
      - name: label
        tests: [not_null]
      - name: scope
        tests:
          - accepted_values: { arguments: { values: ["congress", "chamber", "state", "member"] } }
      - name: source_url
        tests: [not_null]

  - name: composition_seats
    description: >
      Hand-maintained party split of the 435 House and 100 Senate seats (ADR 0012), one row per
      chamber and party group. No ingested source lists vacancies, so this is typed by hand from
      the Clerk of the House and Senate.gov and cross-checked against raw.legislator by the
      warning test assert_composition_matches_legislators. Provenance is the dbt vars
      composition_as_of, composition_house_source_url and composition_senate_source_url.
    config:
      column_types:
        chamber: text
        party_group: text
        seats: integer
        caucus_with: text
    columns:
      - name: chamber
        tests:
          - accepted_values: { arguments: { values: ["house", "senate"] } }
      - name: party_group
        tests:
          - accepted_values:
              arguments: { values: ["republican", "democratic", "independent", "vacant"] }
      - name: seats
        tests: [not_null]
      - name: caucus_with
        tests:
          - accepted_values:
              arguments: { values: ["republican", "democratic"], quote: true }
              config: { where: "caucus_with is not null" }
