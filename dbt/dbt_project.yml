name: term_tracker
version: "0.1.0"
config-version: 2
profile: term_tracker

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

# raw (loaded by ingest/) -> staging (views) -> mart (tables read by the API).
# macros/generate_schema_name.sql makes +schema the literal schema name.
models:
  term_tracker:
    staging:
      +schema: staging
      +materialized: view
    mart:
      +schema: mart
      +materialized: table
      # A table dbt has just rebuilt has no statistics until autovacuum reaches it, and the
      # next model plans its joins blind. On 2026-11-15, with 66 members tracked, the deploy
      # job's rebuild of mart.member_feed ran 29 minutes on such a plan and was cut off by the
      # job's time limit; the same statement had taken seconds in the ingest job minutes
      # before. stg_bill_scope met the same thing on 2026-11-13. Every mart table is analysed
      # as soon as it is built.
      +post-hook: "analyze {{ this }}"

seeds:
  term_tracker:
    +schema: seed

vars:
  # The one Congress the mart, the API and the site describe. Its start and end dates are
  # derived from this number (macros/congress_dates.sql), and api/config.py carries the same
  # number for the ingest; tests/test_rollover.py fails if the two differ. Moving to the next
  # Congress is docs/rollover-runbook.md, not an edit to this line alone.
  current_congress: 119
  # Provenance for seeds/fips.csv (Census state FIPS reference file).
  fips_source_url: "https://www2.census.gov/geo/docs/reference/state.txt"
  fips_fetched_at: "2026-09-12"
  # Provenance for seeds/key_dates.csv.
  key_dates_fetched_at: "2026-09-12"
  # Provenance for seeds/statement_sources.csv (ADR 0015): the day the press URLs and feeds were checked.
  statement_sources_checked_at: "2026-09-19"
  # Provenance for seeds/composition_seats.csv (ADR 0012): the day the counts were checked.
  composition_as_of: "2026-09-19"
  composition_house_source_url: "https://clerk.house.gov/Members"
  composition_senate_source_url: "https://www.senate.gov/senators/"
  # The day the States section describes (ADR 0035, macro states_as_of): empty for today. The
  # January archive sets it to 2026-11-02, the day before the 2026 elections, so the archived
  # site shows the legislatures that served alongside the 119th Congress
  # (docs/rollover-runbook.md).
  states_as_of: null
  # Party of the sitting Vice President, who breaks Senate ties (ADR 0014): republican or democratic.
  senate_vp_party: "republican"
