name: term_tracker
version: "0.1.0"
config-version: 2
profile: term_tracker

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "dbt_packages"]

# raw (loaded by ingest/) -> staging (views) -> mart (tables read by the API).
# macros/generate_schema_name.sql makes +schema the literal schema name.
models:
  term_tracker:
    staging:
      +schema: staging
      +materialized: view
    mart:
      +schema: mart
      +materialized: table
