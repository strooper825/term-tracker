name: term_tracker
version: "0.1.0"
config-version: 2
profile: term_tracker

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

# raw (loaded by ingest/) -> staging (views) -> mart (tables read by the API).
# macros/generate_schema_name.sql makes +schema the literal schema name.
models:
  term_tracker:
    staging:
      +schema: staging
      +materialized: view
    mart:
      +schema: mart
      +materialized: table

seeds:
  term_tracker:
    +schema: seed

vars:
  # The Congress the dashboards cover in v1 (plan section 1).
  current_congress: 119
  current_congress_start: "2025-01-03"
  current_congress_end: "2027-01-03"
  # Provenance for seeds/fips.csv (Census state FIPS reference file).
  fips_source_url: "https://www2.census.gov/geo/docs/reference/state.txt"
  fips_fetched_at: "2026-09-12"
  # Provenance for seeds/key_dates.csv.
  key_dates_fetched_at: "2026-09-12"
  # Provenance for seeds/composition_seats.csv (ADR 0012): the day the counts were checked.
  composition_as_of: "2026-09-19"
  composition_house_source_url: "https://clerk.house.gov/Members"
  composition_senate_source_url: "https://www.senate.gov/senators/"
  # Party of the sitting Vice President, who breaks Senate ties (ADR 0014): republican or democratic.
  senate_vp_party: "republican"
