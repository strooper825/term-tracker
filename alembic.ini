# Alembic configuration. The database URL is not set here: migrations/env.py reads
# DATABASE_URL from the environment (or .env) via api.config.Settings.

[alembic]
script_location = %(here)s/migrations
# Note: prepend_sys_path is deliberately not used; it splits on spaces, which breaks checkouts
# whose path contains one. migrations/env.py puts the repo root on sys.path instead.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
