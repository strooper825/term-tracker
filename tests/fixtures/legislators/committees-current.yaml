  jurisdiction: The House Financial Services Committee has jurisdiction over issues
    pertaining to the economy, the banking system, housing, insurance, and securities
    and exchanges. Additionally, the Committee also has jurisdiction over monetary
    policy, international finance, international monetary organizations, and efforts
    to combat terrorist financing. The Committee oversees the Nation’s economy through
    its oversight of the Federal Reserve Board and individual reserve banks, the Treasury,
    the production and distribution of currency, and the Nation’s capital markets.
  jurisdiction_source: https://financialservices.house.gov/about/
- type: house
  name: House Committee on House Administration
  url: https://cha.house.gov/
  minority_url: https://republicans-cha.house.gov/
  thomas_id: HSHA
  house_committee_id: HA
  subcommittees: []
  jurisdiction: The Committee on House Administration has legislative jurisdiction
    over the federal elections and the day-to-day operations of the House. The Committee's
    jurisdiction over federal elections requires it to consider proposals to amend
    federal election law and to monitor congressional elections across the United
    States. The Committee also sets budget authorizations for expenses of other House
    committees and members of Congress. It also oversees several federal organizations
    such as the Library of Congress and Smithsonian Institution.
  jurisdiction_source: https://cha.house.gov/about
